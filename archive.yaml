    notes: "forge and beacon, review of C5a part 7b (2026-11-16). Gate on C5a part 10. (a) beacon: queued and running StateRecovery tasks, its cool-down map and the Engine's watchedRecoveries survive clearForResync; a recovery between in-place commits moves back against no anchor, and a failClosed after the clear sets faulted, which commitHandoff refuses: SNAP could never hand off. Add StateRecovery.reset() (drain as close() does, wait for the running task, clear failed/running) and call it first in the port's clear. (b) beacon: ForkChoiceManager.currentState keeps the old head; recoverySink.followedHead computes holdFrom from it, giving Pivot/UNREACHABLE refusals that count towards the next escalation: clear it in the port's clear. (c) forge: startSnapSync(minPivotBlock = first.number) bounds the pivot's height, not its chain; PivotSelector takes the highest peer block, and on ETC the heavier chain can be the shorter, so the pivot can land on the chain just left and the branch is then dropped for good: require the pivot header to descend from the given-up block (snapHeaderChainCheck) and persist the minimum pivot (the clear removes SnapSyncMinPivotBlock). (d) forge: the clear runs on the controller's thread behind a whole head move, then range deletes and two synced writes: run it with pipeToSelf on a blocking dispatcher in a clearing state that answers status. (e) beacon: an escalating flag so two queued requests cannot both answer Escalate. (f) untested: regularSync and the audit stopped before the clear; the min pivot reaching the SNAP child; the backfill states re-delivering; a clear that throws."
