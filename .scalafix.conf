rules = [
  DisableSyntax
  ExplicitResultTypes
  NoAutoTupling
  NoValInForComprehension
  OrganizeImports
  ProcedureSyntax
  RemoveUnused
]

DisableSyntax {
  noReturns = true
  noFinalize = true
  // Spec 020 DC-6 / R-2: Scala 3 import syntax only. Keep in sync with
  // scripts/ci/check_scala_imports.sh (the CI gate; scalafix is the local ratchet).
  regex = [
    {
      id = scala2ImportWildcard
      pattern = "^[ \\t]*import[ \\t].*(\\._[ \\t]*($|,|//)|[{,][ \\t]*_[ \\t]*})"
      message = "Scala 2 wildcard import: use `import x.*` or `import x.{given, *}`"
    }
    {
      id = scala2ImportRename
      pattern = "^[ \\t]*import[ \\t].*=>"
      message = "Scala 2 import rename: use `import x.{a as b}`"
    }
  ]
}

OrganizeImports {
  groupedImports = Explode
  targetDialect = Scala3
  groups = [
    "re:javax?\\."
    "org.apache.pekko."
    "cats."
    "monix."
    "scala."
    "scala.meta."
    "*"
    "com.chipprbots.ethereum."
  ]
  removeUnused = true
}

RemoveUnused {
  imports = false // handled by OrganizeImports
}