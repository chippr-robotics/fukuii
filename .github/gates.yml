# ---------------------------------------------------------------------------
# Fukuii CI Gate Matrix — the single source of truth for "what must be green".
#
# Spec: specs/008-ci-gate-integrity/spec.md  (issues #1402, #1403, #1404)
# Enforced by: scripts/ci/check_gate_integrity.py (workflow: gate-integrity.yml)
#
# Rules this file exists to make un-rottable:
#   * Every CI check is declared here with a tier. Undeclared = build failure.
#   * tier: required        -> must be green to merge; MUST have a real gate.
#   * tier: informational   -> observed and reported, not blocking. MUST carry
#                              `issue` + `promote_by` — informational is a
#                              staging area with a deadline, not a parking lot.
#   * tier: quarantined     -> known broken, tracked, EXCLUDED from all public
#                              claims. Also requires `issue` + `promote_by`.
#   * Every waiver expires. No owner/issue/reason/expires -> build failure.
#     Past `expires` -> build failure. There is no bypass; extend it in a PR.
#
# HONESTY RULE (#1403): docs may only claim a suite is "verified"/"compliant"/
# "passing" if its tier here is `required`. The claim linter enforces this.
# ---------------------------------------------------------------------------

version: 1

meta:
  spec: specs/008-ci-gate-integrity/spec.md
  # Warn (do not fail) this many days before a waiver or promote_by date lands.
  warn_window_days: 14

# ---------------------------------------------------------------------------
# Canonical facts (#1403 — "One public truth"). Stated ONCE, here. Every other
# occurrence in docs/README is a reference to this, never a restatement.
# ---------------------------------------------------------------------------
canonical:
  binary: fukuii
  registry: ghcr.io/chippr-robotics/fukuii
  registry_mirror: docker.io/chipprbots/fukuii
  version_source: version.sbt        # FR-019: the ONLY versioning scheme.
  version_scheme: semver             # MAJOR.MINOR.PATCH, .github/VERSIONING.md
  lineage: >-
    Fukuii is a derivative work of IOHK's Mantis client, maintained by Chippr
    Robotics LLC under Apache-2.0. See NOTICE. Mantis is a trademark of IOHK,
    used here only to describe this fork's origin.
  sister_project:
    repo: fukuii-project/fukuii-cli
    relationship: >-
      An independent, ground-up rewrite with no common ancestor and no shared
      source with this repository. It is NOT this release train and NOT a fork
      of this tree. See docs/development/fukuii-project.md for the divergence
      assessment and the clean-room constraint (it replaces issue #1399).
    record: docs/development/fukuii-project.md

# ---------------------------------------------------------------------------
# Required status checks. These are the contexts the `main` ruleset must list,
# spelled exactly as GitHub names the check runs (a reusable-workflow job is
# `<caller job> / <job name>`, e.g. `run / engine`). Steps in
# .github/BRANCH_PROTECTION.md.
# ---------------------------------------------------------------------------
# TARGET STATE. The Gate Integrity check cannot read the ruleset (see the
# reconciliation note below) — this is what it SHOULD require. Each entry is
# the context of a `tier: required` gate below.
required_contexts:
  - Test and Build (JDK 25, Scala 3.9.0)   # ci-test-build
  - Gate Integrity                         # gate-integrity
  # docker-build: docker.yml reports one check per image, none named `Docker Build`.
  - Build Main Docker Image
  - Build Dev Docker Image
  - Build Base Docker Image
  - Build Mainnet Docker Image
  - Build Mordor Docker Image
  - Build Bootnode Docker Image
  - EEST Amsterdam                         # eest-amsterdam
  - run / smoke-genesis                    # hive-smoke-genesis
  - run / smoke-network                    # hive-smoke-network
  - run / sync                             # hive-sync
  - run / engine                           # hive-engine
  - run / consume-rlp                      # hive-consume-rlp

# ---------------------------------------------------------------------------
# RECONCILIATION NOTE — first written 2026-09-20 (#1406); re-checked
# 2026-11-26 (B-550) by reading the live ruleset, which `gh api
# repos/chippr-robotics/fukuii/rules/branches/main` returns to any reader.
#
# Ruleset `Main_Protection` (id 10604881) on `main` requires SIX contexts:
#
#     Test and Build (JDK 25, Scala 3.9.0)    -> keep
#     Coverage (JDK 25, Scala 3.9.0)          -> NOT a gate here (see below)
#     run / engine                            -> keep (hive-engine, required)
#     run / consume-engine                    -> hive-consume-engine is informational
#     Consume-engine Prague sweep             -> REMOVE: hive-prague.yml deleted
#     Consume-engine Osaka sweep              -> REMOVE: hive-osaka.yml deleted
#
# ACTION (needs admin; the ruleset is the user's to change, no check can):
#   1. REMOVE `Consume-engine Prague sweep` and `Consume-engine Osaka sweep`
#      BEFORE the staging -> main 0.13.0 PR merges. Their workflows no longer
#      exist on staging, so those checks never report and the PR waits forever.
#      (The Osaka one ran zero tests and passed — see REMOVED GATES.)
#   2. ADD `Gate Integrity`, `EEST Amsterdam`, `run / smoke-genesis`,
#      `run / smoke-network`, `run / sync` and `run / consume-rlp`, and the six
#      `Build * Docker Image` checks, AFTER the 0.13.0 promotion lands on main:
#      the hive and EEST callers report on every PR only once their `changes`
#      job (_hive-changes.yml) is on main; before that a docs-only PR waits on
#      them forever.
#   3. DECIDE `run / consume-engine` and `Coverage (JDK 25, Scala 3.9.0)`.
#      Both are required by the ruleset and neither is a required gate here:
#      consume-engine is informational (promote_by 2027-03-31, no main-branch
#      evidence yet), and ci.yml labels the Coverage job "Informational, NOT a
#      required check". Either promote/declare them in this file with
#      evidence, or remove them from the ruleset. Until one of those happens the
#      ruleset blocks on checks this matrix says cannot block — the drift this
#      note was written to expose.
#
# Facts that differ from the 2026-09-20 note:
#   * Merge commits are ALLOWED again (repository `allow_merge_commit: true`;
#     the ruleset's allowed_merge_methods are merge, squash, rebase). It has a
#     `non_fast_forward` rule but no `required_linear_history` rule.
#   * There is no `Docker Build` check run: that is docker.yml's workflow name.
#     Its jobs report as `Build <Variant> Docker Image`.
#   * The ruleset has `strict_required_status_checks_policy: true` (branch
#     must be up to date) and requires review-thread resolution.
#
# Constitution rule V.4 stays `aspirational` in
# docs/governance/constitution-enforcement.md: the ruleset can be read, but
# nothing in CI compares it to this list.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Gates
# ---------------------------------------------------------------------------
gates:

  # --- Core build / test -----------------------------------------------------

  - id: ci-test-build
    workflow: ci.yml
    context: Test and Build (JDK 25, Scala 3.9.0)
    tier: required
    owner: realcodywburns
    covers: >-
      compile-all, formatCheck (scalafmt on every module; scalafix on root, bytes, crypto, rlp),
      Tier-1 testEssential, Tier-2 testStandard
      with coverage (develop + PRs into main), KPI baselines, ethereum/tests
      integration job, assembly build.

  - id: docker-build
    workflow: docker.yml
    # One check run per image; all six are in required_contexts.
    context: Build Main Docker Image
    tier: required
    owner: realcodywburns
    covers: Container images build and push for mainnet/mordor/bootnode variants.

  - id: gate-integrity
    workflow: gate-integrity.yml
    context: Gate Integrity
    tier: required
    owner: realcodywburns
    covers: >-
      This matrix itself — undeclared checks, required-but-unfailable gates,
      expired/incomplete waivers, unmapped constitution principles, stale
      generated status doc, dead badges, and over-claiming documentation —
      plus committed keystores, private keys and `.env` files (C15).
      FR-029: the meta-check is itself required, or it guarantees nothing.

  # --- Hive suites ----------------------------------------------------------
  #
  # STATE, 2026-11-26 (B-550): smoke-genesis, smoke-network, sync, engine and
  # consume-rlp are `required`, each on a green workflow_dispatch run on `main`
  # at 78d436c49 (its `evidence:`). The rest stay `informational` with dates.
  #
  # History: on 2026-09-20 every Hive suite was informational, because none had
  # a green run on `main` to point at, and declaring them required would have
  # repeated the v0.8.0 defect in reverse. The MECHANISM landed first
  # (zero-results fails, min_tests, hive_exit enforced — see _hive-sim.yml);
  # promotion needs `evidence`, a green run URL on `main` (check C4).
  #
  # A required Hive caller starts on every PR and passes `skip` to
  # _hive-sim.yml from a `changes` job (_hive-changes.yml), never a `paths:`
  # filter: a workflow that does not start never reports, and a required check
  # that never reports blocks the PR.

  - id: hive-sync
    workflow: hive-sync.yml
    context: run / sync
    tier: required
    owner: realcodywburns
    # workflow_dispatch on main at 78d436c49, 2026-11-26: 18/18, gated fukuii subset all green
    # (min_tests 8).
    evidence: https://github.com/chippr-robotics/fukuii/actions/runs/45903220520
    min_tests: 8
    covers: >-
      Cross-client sync interop. fukuii as sync CLIENT (fukuii syncs from
      go-ethereum/nethermind) and as sync SERVER (go-ethereum/nethermind sync
      from fukuii). Gated on the `fukuii` subset only, so upstream
      geth<->nethermind failures do not pollute this signal.
    status_note: >-
      Required since 2026-11-26 (B-550). #1402's first required-slice item. Both waivers
      are retired (#1407): sync go-ethereum from fukuii passes since fukuii's ENR eth
      entry became [[fork-hash, fork-next]] and the hive adapter advertises the container
      address; sync fukuii from nethermind passes after the fix for the dropped-reply race
      (3af08c103). Main run 45903220520: 18/18.

  - id: hive-smoke-genesis
    workflow: hive-smoke-genesis.yml
    context: run / smoke-genesis
    tier: required
    owner: realcodywburns
    # workflow_dispatch on main at 78d436c49, 2026-11-26: 6/6 (min_tests 1).
    evidence: https://github.com/chippr-robotics/fukuii/actions/runs/45903212878
    min_tests: 1
    covers: Client starts from a hive-supplied genesis and reports a chain head.
    status_note: >-
      Required since 2026-11-26 (B-550). Main run 45903212878: 6/6.

  - id: hive-smoke-network
    workflow: hive-smoke-network.yml
    context: run / smoke-network
    tier: required
    owner: realcodywburns
    # workflow_dispatch on main at 78d436c49, 2026-11-26: 2/2 (min_tests 1).
    evidence: https://github.com/chippr-robotics/fukuii/actions/runs/45903216684
    min_tests: 1
    covers: Client accepts peers and forms a network under hive's harness.
    status_note: >-
      Required since 2026-11-26 (B-550). Main run 45903216684: 2/2.

  - id: hive-consume-rlp
    workflow: hive-consume-rlp.yml
    context: run / consume-rlp
    tier: required
    owner: realcodywburns
    # workflow_dispatch on main at 78d436c49, 2026-11-26: 1471/1471, 4 tests cut off by
    # --sim.timelimit and counted in neither column (min_tests 50).
    evidence: https://github.com/chippr-robotics/fukuii/actions/runs/45903228406
    min_tests: 50
    covers: >-
      EELS consume-rlp — block import from RLP across the fork schedule,
      including the ETC forks. #1402's third required-slice item.
    status_note: >-
      Required since 2026-11-26 (B-550). #1402's third required-slice item. Main run
      45903228406: 1471/1471, 4 cut off. Green on every completed run since 2026-11-20;
      the red runs from 2026-09-23 to 2026-11-19 were those 4 cut-off tests scored as
      failures, which _hive-sim.yml now counts as cut_off (#1957). The 80m limit reaches
      about 1,500-1,700 of the 47,589 tests, so this gate samples; Hive full pass runs the
      suite to completion.

  - id: hive-engine
    workflow: hive-engine.yml
    context: run / engine
    tier: required
    owner: realcodywburns
    # workflow_dispatch on main at 78d436c49, 2026-11-26: 383/383 across 5 suites (min_tests 20).
    evidence: https://github.com/chippr-robotics/fukuii/actions/runs/45903224242
    min_tests: 20
    covers: >-
      Engine API suite, including invalid-payload rejection — #1402's second
      required-slice item. ETH/Sepolia path only.
    status_note: >-
      Required since 2026-11-26 (B-550). #1402's second required-slice item. Main run
      45903224242: 383/383. Already a required context (run / engine) in the live main
      ruleset before this promotion.

  - id: hive-consensus
    workflow: hive-consensus.yml
    context: Hive · consensus
    tier: informational
    owner: realcodywburns
    issue: 1402
    promote_by: 2027-03-31
    min_tests: 50
    covers: ethereum/consensus — state-transition conformance.

  - id: hive-consume-engine
    workflow: hive-consume-engine.yml
    context: Hive · consume-engine
    tier: informational
    owner: realcodywburns
    issue: 1402
    promote_by: 2027-03-31
    min_tests: 874
    covers: >-
      EELS consume-engine — payload import via Engine API. Runs the fixed shard consume-engine-13
      of .github/hive-shards.json (874 tests, ~44 min) to completion; the whole suite runs in hive-full.

  - id: hive-full
    workflow: hive-full.yml
    context: Hive · full pass
    tier: informational
    owner: realcodywburns
    issue: 1402
    promote_by: 2027-03-31
    min_tests: 20
    covers: >-
      consume-engine, consume-rlp and consensus run TO COMPLETION, sharded per
      .github/hive-shards.json (an exact partition, proven by scripts/hive/gen-shards.py).
      The release-PR hive-consume-*/hive-consensus workflows only sample these suites.
    status_note: >-
      Release gate: runs on a `hive-full`-labelled PR to main, or workflow_dispatch —
      ~33 jobs x ~3.5 h per pass, so never per push or nightly. Verdict comes from the aggregate job, never the workflow
      conclusion.

  - id: hive-rpc-compat
    workflow: hive-rpc-compat.yml
    context: Hive · rpc-compat
    tier: informational
    owner: realcodywburns
    issue: 1402
    promote_by: 2027-03-31
    min_tests: 20
    covers: JSON-RPC method compatibility against the reference corpus.

  - id: hive-graphql
    workflow: hive-graphql.yml
    context: Hive · graphql
    tier: informational
    owner: realcodywburns
    issue: 1402
    promote_by: 2027-03-31
    min_tests: 10
    covers: GraphQL endpoint conformance.
    waivers: [graphql-gasprice-stale-fixture, graphql-sendraw-38-underpriced-replacement]

  - id: hive-devp2p
    workflow: hive-devp2p.yml
    context: Hive · devp2p
    tier: informational
    owner: realcodywburns
    issue: 1402
    promote_by: 2027-03-31
    min_tests: 10
    covers: devp2p discovery and RLPx wire conformance.
    status_note: >-
      Two jobs since 2026-09-24. One runs discv4, discv5, snap and snap2 in full; the
      other runs eth without GetCells and BlobTxWithInvalidCells, which are skipped via
      sim_skip and waived until #1409 because they hang the suite. Local hive on
      4dc5b77af: discv4 16/16, discv5 11/11, snap 6/6, snap2 4/4, eth 22/24.

  - id: ethereum-tests-nightly
    workflow: ethereum-tests-nightly.yml
    context: Ethereum Tests
    tier: informational
    owner: realcodywburns
    issue: 1402
    promote_by: 2027-03-31
    covers: >-
      Nightly ethereum/tests across the full ETC and ETH fork schedules, and
      (job legacy-blockchain-tests, B-429) LegacyPreByzantiumBlockchainTestsSpec
      over ethereum/legacytests pinned by commit: the Frontier..EIP158 slice
      (6,817 vectors, a state root per receipt) and Byzantium..Berlin (54,497).
      That job fails on any failing vector and on a missing or partial corpus.
    status_note: >-
      The ethereum/tests job runs with continue-on-error today. Promotion requires
