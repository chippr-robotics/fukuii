      workflow_dispatch and on PRs that touch the BLS files.
    status_note: >-
      New with B-151. The case-by-case differential of blst against both oracles
      runs on Linux in Eip2537DifferentialSpec (ci-test-build). Promote after a
      green run on windows-latest and a green history on BLS-touching PRs.

# ---------------------------------------------------------------------------
# #1402: the first required slice — declared with dates, not asserted as done.
#
# A gate may only be moved to `tier: required` in a PR that also adds an
# `evidence:` field pointing at a green run of that workflow on `main`. The
# Gate Integrity check enforces this: `required` + Hive + no evidence = FAIL.
# That is what stops "required" from becoming another unbacked claim.
# ---------------------------------------------------------------------------
first_required_slice:
  issue: 1402
  target: 2026-12-31
  # Met 2026-11-26 (B-550): all three members are `tier: required` with evidence.
  members:
    - gate: hive-sync
      item: geth<->fukuii sync, BOTH directions
      blocked_by: []
    - gate: hive-engine
      item: invalid-payload rejection
      blocked_by: []
    - gate: hive-consume-rlp
      item: ETC-fork consume-rlp
      blocked_by: []
  rule: >-
    Nightlies MUST NOT report green while any member of this slice is red.
    Enforced structurally by _hive-sim.yml (a suite that produced no results,
    fewer than min_tests results, or any gated-subset failure is red) rather
    than by convention.

# ---------------------------------------------------------------------------
# REMOVED GATES — kept here so a deletion is auditable, not silent.
#
# hive-pyspec (removed 2026-09-20, #1407)
#   `ethereum/pyspec` NO LONGER EXISTS in ethereum/hive. Verified against hive
#   master: simulators/ethereum/ contains consensus, eels, engine, graphql,
#   rpc-compat and sync — no pyspec. The workflow pointed at a simulator that
#   had been deleted upstream, which is why it produced ZERO results with hive
#   exit 1 on 100% of observed runs, while genuinely contended suites
#   (consume-rlp) failed only intermittently. The difference in pattern was
#   the clue.
#
#   Its coverage is not lost. pyspec ran execution-spec-tests fixtures; that
#   corpus is now served by simulators/ethereum/eels/*, whose Dockerfiles
#   clone ethereum/execution-specs directly. We already run two of them —
#   `consume-rlp` (1808 tests) and `consume-engine` (1499) — so the fixtures
#   are still exercised, by more tests than pyspec ever reported here.
#
#   This is supersession, not suppression. Constitution V forbids deleting a
#   failing test to get green; it does not require keeping a reference to a
#   simulator that upstream removed. Nothing that could pass was switched off.
#
# hive-prague, hive-osaka (removed 2026-11-26, B-551, #1402, #1419)
#   Both were standalone callers of ethereum/eels/consume-engine that bypassed
#   _hive-sim.yml, so none of its gates applied: no min_tests, no hive_exit, no
#   cut-off accounting. Both pinned execution-spec-tests fixtures stable@v5.4.0.
#
#   hive-osaka could not fail. stable@v5.4.0 holds no fork_Osaka test, so
#   `--sim.limit '.*fork_Osaka.*'` selected nothing, and its threshold was 0:
#   run 45763364501 (2026-11-26) ended `suites=0 tests=0 failed=0` and passed.
#   It was nonetheless a required check in the live `main` ruleset
#   (`Consume-engine Osaka sweep`) — the v0.8.0 defect, live.
#
#   hive-prague ran `.*fork_Prague.*` with a pass threshold of 400 and a 40m
#   time limit that always ended the run part-way: run 45763364571 passed 831
#   tests, whichever pytest collected first, then `simulation timed out`.
#
#   Coverage is not lost. Every fork_Prague and fork_Cancun test in
#   stable@v5.4.0 belongs to exactly one shard of .github/hive-shards.json
#   (consume-engine-01..13, an exact partition proven by
#   scripts/hive/gen-shards.py). `Hive · consume-engine` (hive-consume-engine.yml)
#   runs shard consume-engine-13 to completion on every PR into main, 874 tests
#   of both forks with min_tests = 874, and `Hive · full pass` (hive-full.yml)
#   runs all 13 shards to completion at release; both go through _hive-sim.yml.
#   Osaka had no coverage to lose: it needs a fixture release with Osaka in it,
#   which is #1419's remaining Hive item for consume-engine and consume-rlp.
#   Until then no CI job runs fork_Osaka fixtures; `eest-amsterdam` (outside
#   Hive) covers the Amsterdam and BPO2->Amsterdam ones.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Waivers — every gate_exclude branch and every sim_skip name in every workflow
# MUST appear here. Missing field or past expiry => Gate Integrity fails. No
# bypass exists.
# ---------------------------------------------------------------------------
waivers:

  - id: graphql-gasprice-stale-fixture
    gate: hive-graphql
    pattern: 07_eth_gasPrice
    owner: realcodywburns
    issue: 1407
    reason: >-
      Stale upstream fixture, not a fukuii defect. hive's
      simulators/ethereum/graphql/testcases/07_eth_gasPrice.json accepts only
      gasPrice 0x10 or 0x1, pre-London fixed prices, on a chain whose head base fee
      is ~0x3437004a. No client that prices from the base fee can return either
      value.

      Measured locally 2026-09-23 on hive master 43ea47b with both clients in one run
      (scripts/hive/local.sh ethereum/graphql --clients fukuii,go-ethereum):

          FAIL 07_eth_gasPrice (fukuii)       got 0x3437004b  (baseFee + 1 wei tip)
          FAIL 07_eth_gasPrice (go-ethereum)  got 0x3446428a  (geth 1.17.7-unstable be58ada)

      The reference client fails the same test, so there is no conformant answer to
      match. fukuii passes every other graphql test (51/52). Lift this waiver when
      upstream updates the fixture.
    expires: 2026-12-31

  - id: graphql-sendraw-38-underpriced-replacement
    gate: hive-graphql
    pattern: 38_eth_sendRawTransaction_transferEther
    owner: realcodywburns
    issue: 1629
    reason: >-
      The fixture conflicts with geth's txpool replacement rule; this is not a fukuii
      defect. Tests 36 and 38 send transactions from the same sender with the same
      nonce, at gas prices 100 gwei and 100 gwei + 1 wei. Since #1629 S0b, fukuii applies
      geth's legacypool rule that a same-nonce replacement must raise both fee caps by
      at least txPool.price-bump, 10%. So the second submission, test 38 under hive's
      serial order, is refused with "replacement transaction underpriced".

      The reference client fails the same test. hive.ethpandaops.io graphql run
      1789896154-0ea9b0641119ca1793c8f513c3a36652.json, with
      Geth/v1.17.6-unstable-a5b90d2a-20260918, has 36_eth_sendRawTransaction_messageCall
      PASS and 38_eth_sendRawTransaction_transferEther FAIL. fukuii on PR #1641 (CI
      2026-10-19) has the same 36 PASS and 38 FAIL, and that is its only gated failure.

      Waived by user decision (2026-10-19) to keep geth's replacement behaviour. Lift
      this waiver when upstream gives test 38 its own nonce or a bumped price.
    expires: 2026-12-31

  - id: devp2p-getcells-needs-sparse-blobpool
    gate: hive-devp2p
    pattern: GetCells
    owner: realcodywburns
    issue: 1409
    reason: >-
      Needs the EIP-8070 sparse blobpool, #1409 scope, which starts once hive is
      green. The test announces blob txs under a custody mask and waits for fukuii
      to fetch cells with GetCells. fukuii never sends one, and go-ethereum's devp2p
      tool waits without a read timeout (readAnyFrom), so the test does not fail:
      it hangs the eth suite until the time limit. That is why hive-devp2p.yml skips
      it (sim_skip) rather than excluding its result.

      Measured locally 2026-09-24 on hive master 43ea47b: GetCells never returned,
      and every eth test that does not need cells passes (22/24 on 4dc5b77af). Lift
      with #1409.
    expires: 2026-12-31

