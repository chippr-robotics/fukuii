      import replay first reached 26,503 / 26,503 on 2026-09-27 (run 36294294338), from
      a baseline of 18,081 (#1415). The workflow starts on every PR and skips its
      job by `if:` when the PR changes nothing it depends on (_hive-changes.yml), so the
      required check always reports. Hive consume-rlp / consume-engine against an
      Amsterdam-capable fixture release is #1419's open remainder, outside this gate.

  # B-151 has no GitHub issue of its own: `issue` is #1767, the B-135 refusal
  # that keeps ETH chains off Windows without this backend. Repoint it once an
  # issue is opened.
  - id: windows-bls
    workflow: windows-bls.yml
    context: Windows BLS12-381 (blst)
    tier: informational
    owner: realcodywburns
    issue: 1767
    promote_by: 2027-01-31
    covers: >-
      The EIP-2537 BLS12-381 precompiles on Windows (B-151, ADR VM-008), where
      eth_pairings has no build and blst (tech.pegasys:jblst) runs them. On
