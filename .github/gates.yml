  - id: eest-amsterdam
    workflow: eest-amsterdam.yml
    context: EEST Amsterdam
    tier: required
    owner: realcodywburns
    issue: 1419
    # A green push run on `main` (002ee9ba9, 2026-11-26): import replay 26,503 / 26,503,
    # builder rebuild 27,352 blocks, position-mirror replay 26,503 / 26,503.
    evidence: https://github.com/chippr-robotics/fukuii/actions/runs/45816167881
    min_tests: 26503
    covers: >-
      execution-specs tests@v21.0.0 Amsterdam and BPO2->Amsterdam blockchain_tests
