name: Hive · engine

on:
  # Release-time only (plus workflow_dispatch). These suites hold a runner for 40-80 min per
  # push and the org has a small shared runner pool; running them on every staging push
  # blocked production CI. They gate the staging -> main release PR instead. Targeted runs
  # belong on a local hive checkout (see docs/testing/hive-local.md).
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'version.sbt'
      - 'project/**'
      - 'hive/**'
      - '.github/workflows/_hive-sim.yml'
      - '.github/workflows/hive-engine.yml'
  workflow_dispatch:
    inputs:
      hive_ref:
        description: 'ethereum/hive git ref'
        required: false
        default: 'master'
      sim_timelimit:
        description: 'Per-sim timelimit (e.g. 40m)'
        required: false
        default: '60m'
      sim_limit:
        description: "Optional --sim.limit regex (e.g. /re-?org for the re-org tests of every suite)"
        required: false
        default: ''
      path_live:
        description: 'Run fukuii with fukuii.state.path-live = true (spec 018 Track C guard, B-314; named fukuii_pathlive)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hive-engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    uses: ./.github/workflows/_hive-sim.yml
    with:
      sim: ethereum/engine
      # A path-live run gets its own label, so its artifacts and summary are not mistaken for the gate's.
      label: ${{ github.event.inputs.path_live == 'true' && 'engine-pathlive' || 'engine' }}
      # Declared in .github/gates.yml (gate `hive-engine`). A run emitting fewer
      # than this many results is a truncated run, not a pass.
      min_tests: 20
      sim_timelimit: ${{ github.event.inputs.sim_timelimit || '60m' }}
      hive_ref: ${{ github.event.inputs.hive_ref || 'master' }}
      sim_limit: ${{ github.event.inputs.sim_limit || '' }}
      path_live: ${{ github.event.inputs.path_live == 'true' }}
