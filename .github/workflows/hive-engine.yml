name: Hive · engine

on:
  # Release-time only (plus workflow_dispatch). These suites hold a runner for 40-80 min per
  # push and the org has a small shared runner pool; running them on every staging push
  # blocked production CI. They gate the staging -> main release PR instead. Targeted runs
  # belong on a local hive checkout (see docs/testing/hive-local.md).
  # Starts on every PR into main, so this required check always reports; the `changes` job decides
  # whether the suite has anything to test (.github/workflows/_hive-changes.yml). A path filter here
  # left the check "Expected" on docs-only PRs and blocked their merge.
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      hive_ref:
        description: 'ethereum/hive git ref'
        required: false
        default: 'master'
      sim_timelimit:
        description: 'Per-sim timelimit (e.g. 40m)'
        required: false
        default: '60m'

permissions:
  contents: read

concurrency:
  group: hive-engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_hive-changes.yml
    with:
      paths: |
        src/
        build.sbt
        version.sbt
        project/
        hive/
        .github/workflows/_hive-sim.yml
        .github/workflows/hive-engine.yml

  run:
    needs: changes
    uses: ./.github/workflows/_hive-sim.yml
    with:
      # Skipped inside _hive-sim.yml, which runs a stand-in job under the same name, so the required
      # check `run / engine` still reports.
      skip: ${{ needs.changes.outputs.run != 'true' }}
      sim: ethereum/engine
      label: engine
      # Declared in .github/gates.yml (gate `hive-engine`). A run emitting fewer
      # than this many results is a truncated run, not a pass.
      min_tests: 20
      sim_timelimit: ${{ github.event.inputs.sim_timelimit || '60m' }}
      hive_ref: ${{ github.event.inputs.hive_ref || 'master' }}
