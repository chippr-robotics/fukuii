name: Hive · smoke-genesis

on:
  # Starts on every PR, so a required check always reports; the `changes` job decides whether the
  # suite has anything to test (.github/workflows/_hive-changes.yml). A path filter here left the
  # check "Expected" on docs-only PRs and blocked their merge.
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:
    inputs:
      hive_ref:
        description: 'ethereum/hive git ref'
        required: false
        default: 'master'
      sim_timelimit:
        description: 'Per-sim timelimit (e.g. 40m)'
        required: false
        default: '20m'

permissions:
  contents: read

concurrency:
  group: hive-smoke-genesis-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_hive-changes.yml
    with:
      paths: |
        src/
        build.sbt
        version.sbt
        project/
        hive/
        .github/workflows/_hive-sim.yml
        .github/workflows/hive-smoke-genesis.yml

  run:
    needs: changes
    uses: ./.github/workflows/_hive-sim.yml
    with:
      # Skipped inside _hive-sim.yml, which runs a stand-in job under the same name, so the required
      # check `run / smoke-genesis` still reports.
      skip: ${{ needs.changes.outputs.run != 'true' }}
      sim: smoke/genesis
      label: smoke-genesis
      # Declared in .github/gates.yml (gate `hive-smoke-genesis`). A run emitting fewer
      # than this many results is a truncated run, not a pass.
      min_tests: 1
      sim_timelimit: ${{ github.event.inputs.sim_timelimit || '20m' }}
      hive_ref: ${{ github.event.inputs.hive_ref || 'master' }}
