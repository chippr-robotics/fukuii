name: Ethereum/Tests Nightly

on:
  schedule:
    # Run at 02:00 GMT (2 AM UTC) every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  comprehensive-ethereum-tests:
    name: Comprehensive Ethereum/Tests Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Cache Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-21-${{ hashFiles('**/build.sbt', '**/build.properties', '**/Dependencies.scala', '**/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-21-
            ${{ runner.os }}-sbt-
      
      - name: Set up SBT
        uses: ./.github/actions/setup-sbt
      
      - name: Compile all modules
        run: sbt compile-all
        env:
          FUKUII_DEV: true
      
      - name: Validate KPI Baselines
        run: |
          echo "=========================================="
          echo "Validating KPI Baselines"
          echo "=========================================="
          echo ""
          
          # Validate baseline definitions
          sbt "testOnly *KPIBaselinesSpec"
          
          echo ""
          echo "✅ KPI baselines validated successfully"
        env:
          FUKUII_DEV: true
      
      - name: Run Comprehensive Ethereum/Tests Suite
        run: |
          echo "=========================================="
          echo "Running comprehensive ethereum/tests suite"
          echo "This validates EVM compliance against official ethereum/tests"
          echo "=========================================="
          echo ""
          
          # Run all ethereum/tests integration tests
          sbt "IntegrationTest / testOnly com.chipprbots.ethereum.ethtest.*" 2>&1 | tee ethereum-tests-output.log
          
          echo ""
          echo "=========================================="
          echo "Ethereum/Tests Results Summary"
          echo "=========================================="
          
          # Extract test summary
          grep -E "(Total number of tests run|Tests: succeeded|All tests passed|TESTS FAILED)" ethereum-tests-output.log || true
          
          echo ""
          echo "Full results available in artifacts"
        env:
          FUKUII_DEV: true
        continue-on-error: true
      
      - name: Generate Test Report
        if: always()
        run: |
          cat > ethereum-tests-summary.md << EOF
          # Ethereum/Tests Nightly Run Summary
          
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          ## Test Results
          
          See attached artifacts for detailed test results and logs.
          
          ## Test Categories Executed
          
          - **SimpleEthereumTest**: Basic validation tests
          - **BlockchainTestsSpec**: Blockchain validation tests
          - **ComprehensiveBlockchainTestsSpec**: Extended blockchain tests
          - **GeneralStateTestsSpec**: State transition tests
          
          ## Artifacts
          
          - `ethereum-tests-output.log`: Full test execution output
          - `fukuii.log`: Application logs from test execution
          
          ## Next Steps
          
          1. Review any test failures
          2. Update issue tracking with results
          3. Investigate any new failures
          
          EOF
          
          cat ethereum-tests-summary.md
      
      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ethereum-tests-nightly-logs-${{ github.run_number }}
          path: |
            ethereum-tests-output.log
            ethereum-tests-summary.md
            /tmp/fukuii-it-test/**/*.log
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ethereum-tests-nightly-reports-${{ github.run_number }}
          path: |
            **/target/test-reports/**
            **/target/scala-*/it-classes/**
          retention-days: 30
          if-no-files-found: warn
      
      - name: Notify on Failure
        if: failure()
        run: |
          echo "::warning::Ethereum/Tests nightly run failed. Check artifacts for details."
          echo "See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }} for details"

  # B-429: LegacyPreByzantiumBlockchainTestsSpec over ethereum/legacytests. The job above runs the same
  # spec without a corpus, and it cancels there; here the corpus is checked out, pinned by commit, and the
  # spec is told it is required, so a missing or partial checkout fails instead of cancelling.
  #
  # Corpus: legacytests @ LEGACY_TESTS_SHA, sparse: Constantinople/BlockchainTests and Cancun/BlockchainTests
  # (14,193 files, ~2.3 GB on disk). Two slices: Frontier/Homestead/EIP150/EIP158 (6,817 vectors; the
  # pre-Byzantium rules ETC history below Atlantis executes under, with a state root per receipt) and
  # Byzantium..Berlin (54,497). Recorded at this commit in specs/018-storage-engine-consolidation/baselines/
  # ethtests-2026-11-22.txt: every vector passes; the known-failure lists are empty (B-432), so any failure
  # fails the job. A local run took 20 min (both slices); a separate job, so it does not count against the
  # 60-minute budget of the job above.
  legacy-blockchain-tests:
    name: Legacy BlockchainTests (ethereum/legacytests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEGACY_TESTS_SHA: 1f581b8ccdc4c63acf5f2c5c1b155c690c32a8eb
      LEGACY_TESTS_FILES: '14193'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check out ethereum/legacytests at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: ethereum/legacytests
          ref: ${{ env.LEGACY_TESTS_SHA }}
          path: legacytests
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            Constantinople/BlockchainTests
            Cancun/BlockchainTests
          sparse-checkout-cone-mode: true

      - name: Verify the corpus
        run: |
          test "$(git -C legacytests rev-parse HEAD)" = "$LEGACY_TESTS_SHA"
          files=$(find legacytests/Constantinople/BlockchainTests legacytests/Cancun/BlockchainTests -name '*.json' | wc -l)
          echo "legacytests $LEGACY_TESTS_SHA: $files fixture files"
          test "$files" -eq "$LEGACY_TESTS_FILES"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Cache Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-25-${{ hashFiles('**/build.sbt', '**/build.properties', '**/Dependencies.scala', '**/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-25-
            ${{ runner.os }}-sbt-

      - name: Set up SBT
        uses: ./.github/actions/setup-sbt

      - name: Run LegacyPreByzantiumBlockchainTestsSpec
        run: sbt "IntegrationTest / testOnly com.chipprbots.ethereum.ethtest.LegacyPreByzantiumBlockchainTestsSpec" 2>&1 | tee legacy-tests-output.log
        shell: bash -o pipefail {0}
        env:
          FUKUII_DEV: true
          FUKUII_LEGACY_TESTS_REQUIRED: '1'
          FUKUII_LEGACY_TESTS_DIRS: ${{ github.workspace }}/legacytests/Constantinople/BlockchainTests:${{ github.workspace }}/legacytests/Cancun/BlockchainTests
          FUKUII_LEGACY_TESTS_REPORT: ${{ github.workspace }}/legacy-tests-failures.txt
          # randomStatetest94 expands EVM memory to ~1.5 GB (the spec's HeapBound); 1024-deep call fixtures need the stack
          SBT_OPTS: -Xmx6g -Xss4M

      - name: Summary
        if: always()
        run: |
          grep -E "(: [0-9]+ run, |TOTAL:|Tests: succeeded|TESTS FAILED|CANCELED)" legacy-tests-output.log || true
          if [ -s legacy-tests-failures.txt ]; then
            echo "--- report (failures, then per-network counts) ---"
            head -100 legacy-tests-failures.txt
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: legacy-tests-nightly-${{ github.run_number }}
          path: |
            legacy-tests-output.log
            legacy-tests-failures.txt
          retention-days: 30
          if-no-files-found: warn
