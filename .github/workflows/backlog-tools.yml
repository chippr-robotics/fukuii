# Backlog tools
#
# Self-tests for scripts/backlog/backlog.py, the CLI of the shared backlog (constitution Principle VIII): claims as
# compare-and-swap through `git push` (racing claims, expiry, --force, heartbeats), the schema check, and a
# deterministic render of the Tracker page. The tests build throwaway bare repositories: git and PyYAML, no network.
# Run locally: `python3 -I -m unittest discover -s scripts/backlog -v`.

name: Backlog Tools

on:
  pull_request:
    paths:
      - 'scripts/backlog/**'
      - '.github/workflows/backlog-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backlog-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Self-test
        run: python3 -I -m unittest discover -s scripts/backlog -v
