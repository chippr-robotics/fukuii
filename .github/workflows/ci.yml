name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - staging
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/docs-*.yml'
      - '.github/workflows/gh-pages.yml'
  pull_request:
    branches:
      - main
      - master
      - staging
      - develop
      - staging

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and Build (JDK 25, Scala 3.3.8)
    # Skip pure version-bump pushes (auto-version) — the merge that caused the bump already
    # ran full CI. pull_request events are unaffected (head_commit is empty there).
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore: bump version to')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Cache Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-25-${{ hashFiles('**/build.sbt', '**/build.properties', '**/Dependencies.scala', '**/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-25-
            ${{ runner.os }}-sbt-
      
      - name: Set up SBT
        run: |
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo gpg --dearmor -o /usr/share/keyrings/scalasbt-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/scalasbt-archive-keyring.gpg] https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          sudo apt-get update
          sudo apt-get install sbt
      
      - name: Check Scala 3 import syntax
        run: |
          scripts/ci/test_check_scala_imports.sh
          scripts/ci/check_scala_imports.sh

      - name: Check formatting
        run: sbt scalafmtCheckAll
        env:
          FUKUII_DEV: true

      - name: Compile all modules
        run: sbt compile-all
        env:
          FUKUII_DEV: true
      
      - name: Run Essential Tests (Tier 1)
        run: |
          echo "=========================================="
          echo "Running Essential Tests (< 15 minutes)"
          echo "=========================================="
          set -o pipefail
          sbt -v testEssential 2>&1 | tee /tmp/sbt-testEssential.log || {
            echo "sbt testEssential failed — dumping 'last test'"
            sbt 'last test' 2>&1 | tee /tmp/sbt-last-test-essential.log || true
            exit 1
          }
        env:
          FUKUII_DEV: true
        timeout-minutes: 25  # Tier 1 runs ~11–15 min on GitHub runners; 15 left no headroom (spec 016 S0d, #1514)
      
      - name: Run Standard Tests (Tier 2)
        # Uninstrumented pass/fail gate: `testStandard` = compile-all + every non-Tier-3 suite (SlowTest included).
        # Coverage is measured in the separate, non-required "Coverage" job below; scoverage instrumentation makes
        # time-sensitive specs flaky and hot loops (Ethash) orders of magnitude slower, so it must not gate merges.
        # Skipped on the staging fast-iteration branch (pushes to staging and PRs targeting staging); it still runs
        # on develop and on the release gate (PRs into main).
        if: github.base_ref != 'staging' && github.ref != 'refs/heads/staging'
        run: |
          echo "=========================================="
          echo "Running Standard Tests (Tier 2, uninstrumented)"
          echo "=========================================="
          set -o pipefail
          sbt -v testStandard 2>&1 | tee /tmp/sbt-testStandard.log || {
            echo "sbt testStandard failed — dumping 'last test'"
            sbt 'last test' 2>&1 | tee /tmp/sbt-last-test-standard.log || true
            exit 1
          }
        env:
          FUKUII_DEV: true
        timeout-minutes: 90
      
      - name: Validate KPI Baselines
        run: |
          echo "=========================================="
          echo "Validating KPI Baselines"
          echo "=========================================="
          echo ""
          set -o pipefail
          sbt -v "testOnly *KPIBaselinesSpec" 2>&1 | tee /tmp/sbt-kpi.log || {
            echo "KPI baseline validation failed"
            sbt 'last test' 2>&1 | tee /tmp/sbt-last-test-kpi.log || true
            exit 1
          }
          echo ""
          echo "✅ KPI baselines validated successfully"
        env:
          FUKUII_DEV: true
      
      - name: Run Gating Integration Tests (deterministic subset)
        run: |
          echo "Running the deterministic, gate-able slice of the it/ suite..."
          # IMPORTANT: enumerate specs explicitly. Only fast, fully-deterministic IT specs belong in
          # the PR gate. The real-socket networking specs (E2EHandshakeSpec, E2ESyncSpec,
          # RegularSyncItSpec, FastSyncItSpec, …) bind TCP ports and depend on RLPx/handshake timing
          # that flakes on shared CI runners — they stay in the nightly only (nightly.yml
          # `IntegrationTest / testOnly`), never in this gate.
          #
          #   ethtest:    SimpleEthereumTest, BlockchainTestsSpec, VMTestsSpec  (EVM compliance)
          #   txExecTest: ForksTest, ContractTest, ECIP1017Test                 (block exec vs fixtures)
          #
          # SlowTest is NOT excluded here: ForksTest/VMTestsSpec are tagged SlowTest but each runs in
          # well under a minute, and excluding it would skip exactly the specs this gate exists to guard.
          sbt "IntegrationTest / testOnly \
            com.chipprbots.ethereum.ethtest.SimpleEthereumTest \
            com.chipprbots.ethereum.ethtest.BlockchainTestsSpec \
            com.chipprbots.ethereum.ethtest.VMTestsSpec \
            com.chipprbots.ethereum.txExecTest.ForksTest \
            com.chipprbots.ethereum.txExecTest.ContractTest \
            com.chipprbots.ethereum.txExecTest.ECIP1017Test"

          echo ""
          echo "=== Gating Integration Results ==="
          echo "EVM compliance (ethereum/tests) + block-execution fixtures (txExecTest) validated."
          echo "Real-socket networking IT specs run in the nightly only — see nightly.yml."
          echo "See test artifacts for detailed results"
        env:
          FUKUII_DEV: true
        timeout-minutes: 15
      
      - name: Build assembly
        run: sbt assembly
        env:
          FUKUII_DEV: true
      
      - name: Build distribution
        run: sbt dist
        env:
          FUKUII_DEV: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-jdk25-scala-3.3.8
          path: |
            **/target/test-reports/**
            **/target/scala-*/test-classes/**/*.log
            /tmp/sbt-*.log
          retention-days: 7
          if-no-files-found: warn
      
      - name: Upload ethereum/tests integration results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ethereum-tests-results-jdk25-scala-3.3.8
          path: |
            **/target/scala-*/it-classes/**/*.log
            /tmp/fukuii-it-test/**/*.log
          retention-days: 7
          if-no-files-found: warn
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fukuii-distribution-jdk25-scala-3.3.8
          path: |
            target/universal/*.zip
            **/target/scala-*/*-assembly-*.jar
          retention-days: 7
          if-no-files-found: warn

  coverage:
    name: Coverage (JDK 25, Scala 3.3.8)
    # Informational, NOT a required check. Instrumented run (scoverage) -> merged report -> Codecov.
    # Same skip rules as the Tier 2 gate: no version-bump pushes, not on the staging fast-iteration branch.
    if: >-
      (github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore: bump version to')) &&
      github.base_ref != 'staging' && github.ref != 'refs/heads/staging'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Cache Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-25-${{ hashFiles('**/build.sbt', '**/build.properties', '**/Dependencies.scala', '**/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-25-
            ${{ runner.os }}-sbt-
      
      - name: Set up SBT
        run: |
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo gpg --dearmor -o /usr/share/keyrings/scalasbt-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/scalasbt-archive-keyring.gpg] https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          sudo apt-get update
          sudo apt-get install sbt
      
      - name: Run instrumented tests (coverage)
        # `clean` forces a coverage-instrumented recompile. Two sbt invocations so a failing sub-module test run
        # cannot skip the root run (and vice versa): the second `coverage` re-sets the same scalacOptions, so
        # nothing recompiles, and no `clean` runs, so the measurement files from the first one are kept.
        # The root run uses the testStandard exclusions from build.sbt plus -l SlowTest: scoverage's per-statement
        # Invoker makes the Ethash hot loops effectively never finish (EthashNonceSearchSpec ran >2 h), and the
        # gating job runs SlowTest uninstrumented. It is a superset of the root half of testEssential, so
        # testEssential is not run again. Test failures (instrumented runs are several times slower and expose
        # timing-sensitive specs) must not stop the report, so this step is continue-on-error; pass/fail is gated
        # by the uninstrumented job. -XX:-ReduceAllocationMerges comes from .jvmopts (sbt JVM) and build.sbt
        # (forked test JVMs).
        id: coverage_tests
        continue-on-error: true
        run: |
          rc=0
          sbt -v "clean; coverage; rlp / test; bytes / test; crypto / test" 2>&1 | tee /tmp/sbt-coverage-submodules.log || rc=1
          sbt -v "coverage; testOnly -- -l BenchmarkTest -l EthereumTest -l SyncTest -l DisabledTest -l SlowTest" 2>&1 | tee /tmp/sbt-coverage-root.log || rc=1
          exit $rc
        env:
          FUKUII_DEV: true
        # Measured ~105 min when testEssential also ran instrumented (compile ~5 + testEssential ~46 + testOnly ~52);
        # dropping the redundant testEssential root run should land near ~60 min. 150 keeps ample headroom.
        timeout-minutes: 150

      - name: Generate coverage reports
        # Reads the measurement files already on disk: no `clean`, no `coverage` toggle (either would recompile or
        # wipe the data). Separate invocations so a root threshold failure in coverageReport still lets the merged
        # report be written; the merged aggregate's exit status is the step result.
        if: always()
        run: |
          sbt -v coverageReport 2>&1 | tee /tmp/sbt-coverage-report.log || echo "root coverageReport failed (e.g. below minimum); continuing to the merged report"
          sbt -v coverageAgg/coverageAggregate 2>&1 | tee /tmp/sbt-coverage-aggregate.log
        env:
          FUKUII_DEV: true
        timeout-minutes: 20
      
      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Specify the coverage file locations for scoverage
          files: ".coverage-agg/target/scala-*/scoverage-report/scoverage.xml"
          directory: .
          flags: unittests
          name: codecov-fukuii
          fail_ci_if_error: false
          verbose: true
      
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports-jdk25-scala-3.3.8
          path: |
            **/target/scala-*/scoverage-report/**
            **/target/scala-*/scoverage-data/**
          retention-days: 30
          if-no-files-found: warn
      
