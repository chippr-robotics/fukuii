# Tracker publish
#
# Runs on every push to the `tracker` branch: a claim, a status change, or a hand edit in the GitHub web UI.
# It checks backlog.yaml against the schema (a bad hand edit fails here, where it was made), then dispatches the
# docs workflow (gh-pages.yml) on main, which renders the Tracker page and deploys docs.fukuii.com within minutes.
# gh-pages.yml also runs hourly as a backstop. A workflow_dispatch created with GITHUB_TOKEN does start a run.

name: Tracker Publish

on:
  push:
    branches:
      - tracker
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# A burst of claims needs one rebuild, not one per claim.
concurrency:
  group: tracker-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tracker branch
        uses: actions/checkout@v5
        with:
          path: tracker

      - name: Checkout the backlog tool from main
        uses: actions/checkout@v5
        with:
          ref: main
          path: main
          sparse-checkout: scripts/backlog

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check backlog.yaml
        run: |
          if [ -f main/scripts/backlog/backlog.py ]; then
            pip install --quiet pyyaml
            python3 -I main/scripts/backlog/backlog.py check --file tracker/backlog.yaml
          else
            echo "::notice::scripts/backlog/backlog.py is not on main yet; schema check skipped"
          fi

      - name: Rebuild the docs site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
