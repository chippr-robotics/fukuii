name: Launchpad PPA

# Publishes a GitHub release to the Launchpad PPA ppa:chipprbots/fukuii
# (https://launchpad.net/~chipprbots/+archive/ubuntu/fukuii).
#
# Launchpad builds from SOURCE packages only, on builders with no network, and sbt is not in the Ubuntu archive. So
# fukuii is not compiled on Launchpad: the source package's upstream tarball is the released distribution
# fukuii-<version>.tgz, byte for byte, checked against the release's SHA256SUMS.txt, and debian/rules only lays it
# out. The packaging (debian/) comes from this workflow's ref, not from the release tag, so an older release can be
# published with current packaging.
#
# Signing: the key and its passphrase are secrets of the protected `launchpad-ppa` environment
# (LAUNCHPAD_GPG_PRIVATE_KEY, LAUNCHPAD_GPG_PASSPHRASE). The key is registered on the bot Launchpad account,
# a member of ~chipprbots. It is imported into a throwaway GnuPG home per job, used through loopback pinentry, and
# deleted when the job ends.

on:
  # A release created by release.yml's GITHUB_TOKEN does not emit a `release` event to other workflows, so follow
  # the Release workflow instead and publish the newest full (non-pre-release) release it produced.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, without the v (for example 0.11.0)"
        required: true
      series:
        description: "Ubuntu series, space-separated"
        required: false
        default: "noble jammy"
      revision:
        description: "Debian revision; raise it to re-publish the same version (Launchpad never accepts a version twice)"
        required: false
        default: "1"

concurrency:
  group: launchpad-ppa
  cancel-in-progress: false

permissions:
  contents: read

env:
  PPA_INCOMING: "~chipprbots/ubuntu/fukuii/"
  DEBFULLNAME: "Chippr Robotics"
  DEBEMAIL: "info@chipprbots.com"

jobs:
  prepare:
    name: Fetch and verify the release
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      todo: ${{ steps.version.outputs.series != '[]' }}
      version: ${{ steps.version.outputs.version }}
      series: ${{ steps.version.outputs.series }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_SERIES: ${{ github.event.inputs.series }}
          INPUT_REVISION: ${{ github.event.inputs.revision }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            SERIES="${INPUT_SERIES:-noble jammy}"
            REVISION="${INPUT_REVISION:-1}"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 \
              --json tagName --jq '.[0].tagName')
            VERSION="${TAG#v}"
            SERIES="noble jammy"
            REVISION="1"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release version: '$VERSION'"; exit 1; }
          [[ "$REVISION" =~ ^[0-9]+$ ]] || { echo "revision must be a number: '$REVISION'"; exit 1; }
          for s in $SERIES; do [[ "$s" =~ ^(jammy|noble|questing)$ ]] || { echo "unsupported series: $s"; exit 1; }; done
          # Launchpad never accepts a version twice, even after deletion, and the Release workflow runs for every
          # pre-release too. So drop each series that already holds this exact version; with none left, stop here.
          PUBLISHED=$(curl -fsS --retry 3 \
            "https://api.launchpad.net/1.0/~chipprbots/+archive/ubuntu/fukuii?ws.op=getPublishedSources&source_name=fukuii&exact_match=true&ws.size=300" \
            | jq -r '.entries[].source_package_version')
          TODO=""
          for s in $SERIES; do
            if grep -qxF "$VERSION-$REVISION~${s}1" <<<"$PUBLISHED"; then
              echo "$VERSION-$REVISION~${s}1 is already in the PPA; skipping $s"
            else
              TODO="$TODO $s"
            fi
          done
          SERIES_JSON=$(printf '%s\n' $TODO | jq -R 'select(length > 0)' | jq -cs .)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "series=$SERIES_JSON" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "fukuii $VERSION (revision $REVISION): uploading for [${TODO# }]"

      - name: Download and verify the release tarball
        if: steps.version.outputs.series != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dl && cd dl
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -p "fukuii-$VERSION.tgz" -p "SHA256SUMS.txt"
          grep -E " \*?fukuii-$VERSION\.tgz$" SHA256SUMS.txt > tgz.sha256
          sha256sum --check --strict tgz.sha256
          # The upstream tarball of the source package is the released tarball itself.
          mv "fukuii-$VERSION.tgz" "fukuii_$VERSION.orig.tar.gz"

      - name: Keep the upstream tarball for the upload jobs
        if: steps.version.outputs.series != '[]'
        uses: actions/upload-artifact@v6
        with:
          name: fukuii-orig-${{ steps.version.outputs.version }}
          path: dl/fukuii_${{ steps.version.outputs.version }}.orig.tar.gz
          retention-days: 3

  upload:
    name: Upload to the PPA (${{ matrix.series }})
    needs: prepare
    if: needs.prepare.outputs.todo == 'true'
    runs-on: ubuntu-24.04
    environment: launchpad-ppa
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        series: ${{ fromJSON(needs.prepare.outputs.series) }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      REVISION: ${{ needs.prepare.outputs.revision }}
      SERIES: ${{ matrix.series }}
    steps:
      - name: Checkout packaging
        uses: actions/checkout@v5

      - name: Download the upstream tarball
        uses: actions/download-artifact@v7
        with:
          name: fukuii-orig-${{ needs.prepare.outputs.version }}
          path: work

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debhelper devscripts dput gnupg

      - name: Build the source package
        run: |
          set -euo pipefail
          cd work
          tar xzf "fukuii_$VERSION.orig.tar.gz"
          test -d "fukuii-$VERSION"
          cp -r "$GITHUB_WORKSPACE/debian" "fukuii-$VERSION/"
          cd "fukuii-$VERSION"
          dch --newversion "$VERSION-$REVISION~${SERIES}1" --distribution "$SERIES" --force-distribution \
            "Release $VERSION. See https://github.com/chippr-robotics/fukuii/releases/tag/v$VERSION"
          # Source only; -sa includes the upstream tarball in every upload (each series' first upload of a version
          # needs it, and Launchpad accepts the identical file again).
          dpkg-buildpackage -S -sa -d -us -uc

      - name: Sign
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "$GPG_PRIVATE_KEY" ] && [ -n "$GPG_PASSPHRASE" ] || { echo "launchpad-ppa signing secrets are not set"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          # dput verifies the signature before uploading, so the Upload step needs this keyring too.
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-pass" && chmod 600 "$RUNNER_TEMP/gpg-pass"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          FPR=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/ {print $10; exit}')
          [ -n "$FPR" ] || { echo "no secret key imported"; exit 1; }
          # Our own key in a throwaway keyring: trust it, so dput's signature check reports it valid.
          echo "$FPR:6:" | gpg --batch --quiet --import-ownertrust
          echo "Signing with $FPR"
          CHANGES="work/fukuii_$VERSION-$REVISION~${SERIES}1_source.changes"
          debsign -k"$FPR" -p"gpg --batch --pinentry-mode loopback --passphrase-file $RUNNER_TEMP/gpg-pass" "$CHANGES"
          gpg --batch --verify "$CHANGES"
          gpg --batch --verify "work/fukuii_$VERSION-$REVISION~${SERIES}1.dsc"

      - name: Upload
        run: |
          set -euo pipefail
          cat > "$HOME/.dput.cf" <<DPUT
          [chipprbots-ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = $PPA_INCOMING
          login = anonymous
          allow_unsigned_uploads = 0
          DPUT
          dput chipprbots-ppa "work/fukuii_$VERSION-$REVISION~${SERIES}1_source.changes"
          {
            echo "## fukuii $VERSION uploaded for $SERIES"
            echo ""
            echo "Launchpad builds it next: https://launchpad.net/~chipprbots/+archive/ubuntu/fukuii/+packages"
            echo ""
            echo '```bash'
            echo "sudo add-apt-repository ppa:chipprbots/fukuii"
            echo "sudo apt-get install fukuii"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/gnupg" "$RUNNER_TEMP/gpg-pass"
