# Documentation Link Checker Workflow
#
# Checks for broken links in documentation
# Runs on PRs that modify docs and weekly on develop branch

name: Check Documentation Links

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  schedule:
    # Run weekly on Sunday at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      # Build under _linkcheck/fukuii/ so the site sits at the same /fukuii/ path GitHub Pages serves it
      # from (site_url in mkdocs.yml). Two things depend on that layout:
      #   - the 404 page's nav links are root-relative (/fukuii/...), and --root-dir resolves them here;
      #   - a relative link that escapes the site (../../ops/...) no longer lands inside the repo
      #     checkout, where it used to resolve by accident while 404ing on the deployed site.
      - name: Build documentation
        run: mkdocs build --site-dir _linkcheck/fukuii

      # Two remaps check links that point at this repo against this checkout instead of the network:
      #   - the site's own deployed URLs (each page's rel=canonical) -> the local build, since the
      #     deployed site lags a PR that adds pages;
      #   - github.com/.../fukuii/blob|tree/main/<path> -> <path> in the checkout, since main lags
      #     staging until release. A link to a file that does not exist in the tree still fails.
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,204
            --root-dir '${{ github.workspace }}/_linkcheck'
            --remap '^https://chippr-robotics\.github\.io/fukuii/ file://${{ github.workspace }}/_linkcheck/fukuii/'
            --remap '^https://github\.com/chippr-robotics/fukuii/(?:blob|tree)/main/ file://${{ github.workspace }}/'
            --exclude 'localhost'
            --exclude '127.0.0.1'
            --exclude 'github.com/.*/edit/'
            --exclude 'github.com/.*/issues/new'
            './_linkcheck/fukuii/**/*.html'
          fail: true
        continue-on-error: true

      - name: Create Issue on Failure
        if: steps.lychee.outcome == 'failure' && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Documentation Link Check Failed
          content-filepath: ./lychee/out.md
          labels: |
            documentation
            automated

      - name: Comment on PR
        # Skip on fork PRs — posting a comment needs a write token forks don't get
        # (same fork-guard autofix.yml and pr-management.yml already use).
        if: steps.lychee.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ./lychee/out.md
