name: Hive · devp2p

on:
  # Release-time only (plus workflow_dispatch). These suites hold a runner for 40-80 min per
  # push and the org has a small shared runner pool; running them on every staging push
  # blocked production CI. They gate the staging -> main release PR instead. Targeted runs
  # belong on a local hive checkout (see docs/testing/hive-local.md).
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'version.sbt'
      - 'project/**'
      - 'hive/**'
      - '.github/workflows/_hive-sim.yml'
      - '.github/workflows/hive-devp2p.yml'
  workflow_dispatch:
    inputs:
      hive_ref:
        description: 'ethereum/hive git ref'
        required: false
        default: 'master'
      sim_timelimit:
        description: 'Per-sim timelimit (e.g. 40m)'
        required: false
        default: '40m'

permissions:
  contents: read

concurrency:
  group: hive-devp2p-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Two jobs, because the simulator runs its suites in order (discv4, discv5, eth, snap, snap2) and
# a test that never finishes stops every suite after it. Both are gate `hive-devp2p` in
# .github/gates.yml. A job emitting fewer than its min_tests results is a truncated run, not a pass.
jobs:
  # discv4, discv5, snap and snap2: every test.
  discovery-snap:
    uses: ./.github/workflows/_hive-sim.yml
    with:
      sim: devp2p
      label: devp2p
      sim_limit: 'discv4|discv5|snap'
      min_tests: 30
      sim_timelimit: ${{ github.event.inputs.sim_timelimit || '40m' }}
      hive_ref: ${{ github.event.inputs.hive_ref || 'master' }}

  # eth: every test except the two that wait for a GetCells request. fukuii cannot send one until
  # the EIP-8070 sparse blobpool exists (#1409), and the test tool reads without a timeout there,
  # so either would hang the suite until the time limit. Both are dated waivers in gates.yml.
  eth:
    uses: ./.github/workflows/_hive-sim.yml
    with:
      sim: devp2p
      label: devp2p-eth
      sim_limit: 'eth'
      sim_skip: 'GetCells|BlobTxWithInvalidCells'
      min_tests: 20
      sim_timelimit: ${{ github.event.inputs.sim_timelimit || '40m' }}
      hive_ref: ${{ github.event.inputs.hive_ref || 'master' }}
