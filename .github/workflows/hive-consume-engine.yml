name: Hive · consume-engine

# consume-engine gate: one fixed shard (consume-engine-13) of the release shard plan.
# hive-prague.yml and hive-osaka.yml run narrower per-fork sweeps with their
# own pass thresholds; this workflow is the broad cross-fork companion.
# Long-running (~60min); restricted to main-bound PRs + manual dispatch only.

on:
  # Release-time only (plus workflow_dispatch). These suites hold a runner for 40-80 min per
  # push and the org has a small shared runner pool; running them on every staging push
  # blocked production CI. They gate the staging -> main release PR instead. Targeted runs
  # belong on a local hive checkout (see docs/testing/hive-local.md).
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'version.sbt'
      - 'project/**'
      - 'hive/**'
      - '.github/workflows/_hive-sim.yml'
      - '.github/workflows/hive-consume-engine.yml'
      - '.github/hive-shards.json'
  workflow_dispatch:
    inputs:
      hive_ref:
        description: 'ethereum/hive git ref'
        required: false
        default: 'master'
      sim_timelimit:
        description: 'Per-sim timelimit (e.g. 60m)'
        required: false
        default: '60m'
      sim_limit:
        description: 'Optional --sim.limit regex (e.g. .*fork_Cancun.*)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hive-consume-engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate runs ONE fixed shard of the release shard plan (.github/hive-shards.json,
  # generated and proven an exact partition by scripts/hive/gen-shards.py), so every run
  # executes the same tests to completion against the fixtures that plan was built from.
  #
  # Before 2026-10-06 this gate ran the suite unfiltered: 42,234 items, of which an 80m
  # --sim.timelimit reached ~1,700 (whatever pytest collected first, ~60% Cancun) before hive
  # killed the run. The last ~4 tests always died waiting for container startup and were
  # scored as failures, so the gate went red on wall-clock alone (PR #1484: 1,697/1,701).
  # Full-suite coverage is the release-time `Hive · full pass` (hive-full.yml), which runs
  # every shard to completion.
  plan:
    runs-on: ubuntu-latest
    outputs:
      sim_limit: ${{ steps.p.outputs.sim_limit }}
      buildarg: ${{ steps.p.outputs.buildarg }}
      min_tests: ${{ steps.p.outputs.min_tests }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        env:
          SHARD: consume-engine-13
          OVERRIDE: ${{ github.event.inputs.sim_limit || '' }}
        run: |
          python3 - <<'PY'
          import json, os
          plan = json.load(open(".github/hive-shards.json"))
          shards = {s["name"]: s for s in plan["suites"]["consume-engine"]["shards"]}
          shard = shards[os.environ["SHARD"]]
          override = os.environ["OVERRIDE"]
          # A dispatch with an explicit sim_limit is an ad-hoc run: no shard size to enforce.
          sim_limit = override or shard["sim_limit"]
          min_tests = 20 if override else shard["est_tests"]
          # Pin the fixtures to the release the shard plan was generated from; with the
          # simulator's default fixtures the shard regex would select a different set.
          buildarg = f"fixtures={plan['eest_fixtures']}\ndisable_strict_exception_matching=nimbus-el,fukuii"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"sim_limit={sim_limit}\n")
              f.write(f"min_tests={min_tests}\n")
              f.write(f"buildarg<<EOF_BUILDARG\n{buildarg}\nEOF_BUILDARG\n")
          print(f"{os.environ['SHARD']}: {shard['est_tests']} tests, ~{shard['est_minutes']} min; "
                f"min_tests={min_tests}; override={'yes' if override else 'no'}")
          PY

  run:
    needs: plan
    uses: ./.github/workflows/_hive-sim.yml
    with:
      sim: ethereum/eels/consume-engine
      label: consume-engine
      # The shard's exact test count (the plan is an exact partition of the pinned fixtures):
      # any shortfall means the run was truncated, not that it passed.
      min_tests: ${{ fromJSON(needs.plan.outputs.min_tests) }}
      # consume-engine-13 is ~874 tests / ~44 min at --sim.parallelism 4; 80m leaves room for
      # a slow runner without reintroducing the timeout tail.
      sim_timelimit: ${{ github.event.inputs.sim_timelimit || '80m' }}
      sim_limit: ${{ needs.plan.outputs.sim_limit }}
      sim_buildarg: ${{ needs.plan.outputs.buildarg }}
      hive_ref: ${{ github.event.inputs.hive_ref || 'master' }}
