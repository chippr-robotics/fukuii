name: Hive · consume-engine

# Unfiltered consume-engine sweep (all forks).
# hive-prague.yml and hive-osaka.yml run narrower per-fork sweeps with their
# own pass thresholds; this workflow is the broad cross-fork companion.
# Long-running (~60min); restricted to main-bound PRs + manual dispatch only.

on:
  pull_request:
    branches: [main, master, staging]
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'version.sbt'
      - 'project/**'
      - 'hive/**'
      - '.github/workflows/_hive-sim.yml'
      - '.github/workflows/hive-consume-engine.yml'
  workflow_dispatch:
    inputs:
      hive_ref:
        description: 'ethereum/hive git ref'
        required: false
        default: 'master'
      sim_timelimit:
        description: 'Per-sim timelimit (e.g. 60m)'
        required: false
        default: '60m'
      sim_limit:
        description: 'Optional --sim.limit regex (e.g. .*fork_Cancun.*)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hive-consume-engine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    uses: ./.github/workflows/_hive-sim.yml
    with:
      sim: ethereum/eels/consume-engine
      label: consume-engine
      # Declared in .github/gates.yml (gate `hive-consume-engine`). A run emitting fewer
      # than this many results is a truncated run, not a pass.
      min_tests: 20
      # 80m, raised from 60m. Measured on 501368ec9: both suites ran exactly 60:00 and hit
      # `simulation timed out` with the last 4 tests each still being launched — consume-engine
      # stopped at 1469/1473, consume-rlp at 1698/1702. hive killed those clients with
      # `timed out waiting for container startup` and scored them "Test was terminated by host",
      # which reads as 8 fukuii failures but is the tail of a suite out of wall clock. Which 4
      # tests land in that tail depends on scheduling, which is why gates.yml records consume-rlp
      # as failing "only intermittently". No test is changed; the suite is given time to finish.
      sim_timelimit: ${{ github.event.inputs.sim_timelimit || '80m' }}
      sim_limit: ${{ github.event.inputs.sim_limit || '' }}
      sim_buildarg: disable_strict_exception_matching=nimbus-el,fukuii
      hive_ref: ${{ github.event.inputs.hive_ref || 'master' }}
