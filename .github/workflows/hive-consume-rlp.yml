name: Hive · consume-rlp

on:
  pull_request:
    branches: [main, master, staging]
    paths:
      - 'src/**'
      - 'build.sbt'
      - 'version.sbt'
      - 'project/**'
      - 'hive/**'
      - '.github/workflows/_hive-sim.yml'
      - '.github/workflows/hive-consume-rlp.yml'
  workflow_dispatch:
    inputs:
      hive_ref:
        description: 'ethereum/hive git ref'
        required: false
        default: 'master'
      sim_timelimit:
        description: 'Per-sim timelimit (e.g. 60m)'
        required: false
        default: '60m'
      sim_limit:
        description: 'Optional --sim.limit regex'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hive-consume-rlp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    uses: ./.github/workflows/_hive-sim.yml
    with:
      sim: ethereum/eels/consume-rlp
      label: consume-rlp
      # Declared in .github/gates.yml (gate `hive-consume-rlp`). A run emitting fewer
      # than this many results is a truncated run, not a pass.
      min_tests: 50
      # 80m, raised from 60m. This does NOT let the suite finish, and cannot: pytest collects
      # 47,589 items for this simulator, and at --sim.parallelism 4 a 60m run launched only
      # 1,702 of them (~3.6%). Measured on 501368ec9. Finishing would take on the order of a day.
      #
      # What the extra time buys is coverage: ~1/3 more tests exercised per run. It does not
      # remove the timeout tail — every run still ends with `simulation timed out` and ~4 tests
      # killed mid-launch (`timed out waiting for container startup`), scored "Test was terminated
      # by host". Those are wall-clock artifacts, not client failures; which tests land in the tail
      # depends on scheduling, which is why gates.yml records this suite as failing
      # "only intermittently". Whether this gate should instead run a --sim.limit subset that can
      # complete is a scoping decision, recorded in specs/009-amsterdam-fork-support/.
      sim_timelimit: ${{ github.event.inputs.sim_timelimit || '80m' }}
      sim_limit: ${{ github.event.inputs.sim_limit || '' }}
      sim_buildarg: disable_strict_exception_matching=nimbus-el,fukuii
      hive_ref: ${{ github.event.inputs.hive_ref || 'master' }}
