# GitHub Pages Deployment Workflow
#
# This workflow deploys documentation from the docs/ folder to GitHub Pages
# using MkDocs Material for enhanced features including:
# - Mermaid diagram rendering
# - Full-text search
# - Audience-focused navigation tabs
# - Dark/light mode toggle
#
# URL: https://chippr-robotics.github.io/fukuii/
#
# Triggers:
# - Push to main/master/develop branches (docs changes)
# - Manual dispatch for ad-hoc deployments; the `tracker` branch's tracker-publish.yml dispatches this workflow on
#   main after every claim or status change, so the Tracker page follows the shared backlog within minutes
# - Hourly schedule: a backstop for the Tracker page (stale-claim badges age even when nothing is pushed)
# - Pull requests (build only, no deploy - for validation)
#
# The Tracker page (docs/development/tracker/) is rendered at build time from backlog.yaml on the `tracker` branch by
# scripts/backlog/backlog.py. The committed index.md is a placeholder that the render overwrites; if the branch is
# missing or the render fails, the placeholder stays and the build goes on (the failure shows as a warning here and
# as a failed check on the tracker branch's own workflow).

name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/backlog/**'
      - '.github/workflows/gh-pages.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Render the Tracker page from the tracker branch
        run: |
          if git ls-remote --exit-code --heads origin tracker >/dev/null; then
            python3 -I scripts/backlog/backlog.py render --out docs/development/tracker \
              || echo "::warning title=Tracker::render failed; the Tracker page keeps its placeholder"
          else
            echo "::notice title=Tracker::origin has no tracker branch; the Tracker page keeps its placeholder"
          fi

      - name: Build documentation
        run: mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Only deploy from main — the github-pages environment protection rules
    # restrict deploys to main, so develop/master pushes would always fail this step.
    # Skipping (success) on non-main refs is the cleanest match for that policy.
    # A push, a manual or tracker dispatch run on main, and the hourly schedule (which runs on main) deploy;
    # pull requests only build.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
