name: EEST Amsterdam

# Replays execution-specs' Amsterdam blockchain_tests (tests@v21.0.0: the Amsterdam and
# BPO2->Amsterdam directories, 26,503 tests) through fukuii's block import path with
# EestFixtureCorpusSpec. Declared in .github/gates.yml as `eest-amsterdam`.
#
# The corpus is not vendored. scripts/eest/fetch_fixtures.py streams the ~1 GB release asset
# and stops once past the wanted directories (~265 MB read), and the result is cached per
# release tag.

on:
  pull_request:
    branches: [staging, main]
    paths:
      - 'src/main/**'
      - 'src/test/scala/com/chipprbots/ethereum/ledger/Eest*'
      - 'scripts/eest/**'
      - '.github/workflows/eest-amsterdam.yml'
      - 'build.sbt'
      - 'project/**'
  push:
    branches: [staging, main]
    paths:
      - 'src/main/**'
      - 'scripts/eest/**'
      - '.github/workflows/eest-amsterdam.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eest-amsterdam-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EEST_RELEASE: tests@v21.0.0
  # The corpus holds 26,503 tests; fewer means a partial fetch, which must fail rather than pass.
  EEST_MIN_TESTS: '26503'

jobs:
  eest-amsterdam:
    name: EEST Amsterdam
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'sbt'

      - name: Cache Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-25-${{ hashFiles('**/build.sbt', '**/build.properties', '**/Dependencies.scala', '**/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-25-
            ${{ runner.os }}-sbt-

      - name: Set up SBT
        run: |
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo gpg --dearmor -o /usr/share/keyrings/scalasbt-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/scalasbt-archive-keyring.gpg] https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          sudo apt-get update
          sudo apt-get install sbt

      - name: Cache fixtures
        id: fixtures-cache
        uses: actions/cache@v5
        with:
          path: eest-fixtures
          key: eest-${{ env.EEST_RELEASE }}-amsterdam-${{ hashFiles('scripts/eest/fetch_fixtures.py') }}

      - name: Fetch fixtures
        if: steps.fixtures-cache.outputs.cache-hit != 'true'
        run: python3 scripts/eest/fetch_fixtures.py eest-fixtures --release "$EEST_RELEASE"

      - name: Replay the corpus
        run: sbt "testOnly *EestFixtureCorpusSpec"
        env:
          FUKUII_DEV: true
          EEST_FIXTURES: ${{ github.workspace }}/eest-fixtures/fixtures
          EEST_REPORT: ${{ github.workspace }}/eest-report.txt
          SBT_OPTS: -Xmx6g -Xss4M

      - name: Summary
        if: always()
        run: |
          if [ -f eest-report.txt ]; then
            {
              echo '```'
              sed -n '1,/^failures/p' eest-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,/^failures/p' eest-report.txt
          else
            echo "No report: the replay did not run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eest-amsterdam-report
          path: eest-report.txt
          if-no-files-found: warn
