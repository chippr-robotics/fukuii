pekko {
  # to enable logging use: ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loggers = []

  loglevel = OFF

  ssl-config {
    trustManager = {
      stores = [
        # When Fukuii serves JSON-RPC over https with a self-signed certificate (docs/runbooks/tls-operations.md),
        # mallet has to trust that certificate. `tls/gen-cert.sh` writes it in PEM next to the keystore
        # (`tls/fukuii-rpc.crt` by default); uncomment the entry below, adjusting the path:
        #
        # { type = "PEM", path = "tls/fukuii-rpc.crt" }
      ]
    }
  }
}
