include classpath("application.conf")

# Platåberget — public Glamsterdam testnet (chain id 7091047534). Launch with `fukuii plataberget`.
# Post-Merge from genesis: pair this node with a consensus-layer client built for
# glamsterdam-devnet-8 (ethpandaops/<client>:glamsterdam-devnet-8), connected over the Engine API.
# Amsterdam has been active since 2026-08-20, so following the chain head needs the full
# Amsterdam EL rule set — see docs/specifications/GLAMSTERDAM.md for what fukuii implements.
fukuii {
  blockchains {
    network = "plataberget"
  }

  sync {
    # A fresh node imports the chain from genesis with regular sync over devp2p, toward the head the
    # consensus client designates with forkchoiceUpdated. Set do-snap-sync = true to SNAP-sync to the head
    # instead (the Platåberget soak does, #1432).
    do-snap-sync = false

    snap-sync {
      # Same trie layout as the other post-merge ETH chains (see sepolia.conf).
      storage-scheme = "path"
      # Backfill historical bodies/receipts only after SNAP state is complete (disk-IO contention, see base/sync.conf).
      defer-chain-backfill-until-state-complete = true
    }
  }

  # ETH-family chain: advertise eth/70 (EIP-7975 partial receipts) and eth/71 (EIP-8159 block access
  # lists) on top of the eth/68-69 + snap/1 defaults (see conf/base/network.conf). eth/71 lets regular-sync
  # catch-up fetch Amsterdam block access lists from peers and prefetch state; no list is requested for a
  # header without blockAccessListHash, so it is inert before Amsterdam. Peers that do not offer eth/70-71
  # negotiate down to eth/69. snap/2 stays off: it drops GetTrieNodes, which SNAP healing needs.
  network.protocols {
    eth70 = true
    eth71 = true
  }

  mining {
    # Post-merge chain: `engine-api` selects TransitionBlockHeaderValidator, which applies PoS
    # header rules to difficulty-0 blocks. The inherited default (`pow`) would wire the Ethash
    # validator and reject every Platåberget header. Inert for block building. See sepolia.conf.
    protocol = "engine-api"
  }
}
