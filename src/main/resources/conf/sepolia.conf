include classpath("application.conf")

fukuii {
  blockchains {
    network = "sepolia"
  }

  sync {
    # Sepolia is post-merge — blocks come via Engine API from the consensus layer.
    # Peer sync is used only for state/body fetching, not block discovery.
    do-fast-sync = false
    do-snap-sync = false

    snap-sync {
      # ETH Sepolia (post-merge) uses path-scheme trie storage: one node per path slot,
      # enabling inline pruning.
      storage-scheme = "path"
    }
  }

  mining {
    # Post-merge chain: blocks arrive from the consensus layer over the Engine API,
    # they are not Ethash-sealed. Without this override the value inherited from
    # conf/base/mining.conf is `pow`, which wires PoWBlockHeaderValidator ->
    # EthashBlockHeaderValidator.validateHeader unconditionally (no difficulty == 0
    # branch), so every PoS header would fail with HeaderPoWError the moment the
    # header validator is actually reached. `engine-api` selects
    # TransitionBlockHeaderValidator, which dispatches on difficulty: PoW rules for
    # pre-merge blocks, PoS rules for difficulty == 0.
    #
    # This is inert for block building -- MiningBuilder.buildMining maps EngineApi to
    # the same buildPoWMining() as PoW, and mining-enabled stays false.
    #
    # The deployment overlay ops/barad-dur/sepolia/fukuii-conf/sepolia.conf already sets
    # this; the bundled config did not, so anyone running -Dconfig.resource=conf/sepolia.conf
    # without the overlay got the wrong validator.
    protocol = "engine-api"
  }
}
