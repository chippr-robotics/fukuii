include classpath("application.conf")

fukuii {
  blockchains {
    network = "hive"
  }

  sync {
    do-snap-sync = false
  }

  # hive's devp2p tool (go-ethereum master) speaks only eth/72 + snap/2, and every hive network
  # is ETH-family, so hive advertises the full set. The global default stays eth/68-69 + snap/1.
  network.protocols {
    eth70 = true
    eth71 = true
    eth72 = true
    snap2 = true
  }

  # Archive pruning for chain import — reference count pruning requires
  # onBlockSave() hooks that chain import bypasses
  pruning {
    mode = "archive"
  }
}
