tui {
  # The terminal UI (`fukuii <network> --tui`).

  # Glyph set: emoji, ascii, or auto. auto draws ASCII when the locale (LC_ALL, then LC_CTYPE, then LANG) is not
  # UTF-8. The FUKUII_TUI_GLYPHS environment variable overrides this. NO_COLOR, set to a non-empty value, turns colour
  # off (no-color.org).
  glyphs = auto

  # Motion: the worm's ripple, the [ACTIVE...] pulse, spinners, the splash and the celebration. While anything moves the
  # TUI draws a frame every animation-interval-ms (4 fps); otherwise every second. reduced-motion = true stops all of it
  # except the worm moving with progress, and paces frames at one a second. FUKUII_TUI_MOTION = reduced | full
  # overrides it. The pace is at least 50 ms.
  animation-interval-ms = 250
  reduced-motion = false

  # How often the TUI polls the node (peers, sync status), on its own thread; at least 100 ms.
  status-poll-interval-ms = 1000

  # The startup splash, skipped by any key; 0 turns it off. FUKUII_TUI_NO_SPLASH, set to a non-empty value, turns it
  # off too.
  splash-ms = 3000

  # The Logs view (5, l) and the Recent strips: the newest log-ring-size lines (1 to 10000) at log-level and above
  # (TRACE, DEBUG, INFO, WARN or ERROR), kept by an appender of the TUI's own beside the log file's. A logger's own
  # level in logback.xml applies first: DEBUG here shows only what the loggers already log at DEBUG.
  log-ring-size = 1000
  log-level = INFO

  # read-only = true: no operator action can run from the TUI, and q does not offer to stop the node (Ctrl-C still
  # does). For wall displays, demos and shared sessions. FUKUII_TUI_READ_ONLY, set to a non-empty value, sets it too.
  read-only = false
}
