tui {
  # The terminal UI (`fukuii <network> --tui`).

  # Glyph set: emoji, ascii, or auto. auto draws ASCII when the locale (LC_ALL, then LC_CTYPE, then LANG) is not
  # UTF-8. The FUKUII_TUI_GLYPHS environment variable overrides this. NO_COLOR, set to a non-empty value, turns colour
  # off (no-color.org).
  glyphs = auto

  # The TLS profile of the endpoint test's call to an HTTPS RPC listener (spec 030 FR-046). Unset: the certificate is
  # reported and not verified, and to a listener with client-auth = "need" the listener's own keystore is presented.
  # A profile under fukuii.tls.profiles, or "system": the certificate is verified on it, host name included.
  probe.tls-profile = null

  # Motion: the worm's ripple, the [ACTIVE...] pulse, spinners, the splash and the celebration. While anything moves the
  # TUI draws a frame every animation-interval-ms (4 fps); otherwise every second. reduced-motion = true stops all of it
  # except the worm moving with progress, and paces frames at one a second. FUKUII_TUI_MOTION = reduced | full
  # overrides it. The pace is at least 50 ms.
  animation-interval-ms = 250
  reduced-motion = false

  # How often the TUI polls the node (peers, sync status), on its own thread; at least 100 ms.
  status-poll-interval-ms = 1000

  # The startup splash, skipped by any key; 0 turns it off. FUKUII_TUI_NO_SPLASH, set to a non-empty value, turns it
  # off too.
  splash-ms = 3000

  # The Logs view (5, l) and the Recent strips: the newest log-ring-size lines (1 to 10000) at log-level and above
  # (TRACE, DEBUG, INFO, WARN or ERROR), kept by an appender of the TUI's own beside the log file's. A logger's own
  # level in logback.xml applies first: DEBUG here shows only what the loggers already log at DEBUG.
  log-ring-size = 1000
  log-level = INFO

  # Graphics: auto, pixel, block or text. pixel draws with the Kitty graphics protocol (kitty, Ghostty); block draws the
  # same art in half-block character cells, on any 256-colour terminal; text draws none. auto asks the terminal: pixel
  # if it answers, block if it does not or under tmux and screen, text under NO_COLOR. FUKUII_TUI_GRAPHICS overrides
  # this, and the v key switches while it runs.
  graphics = auto

  # A directory of sprite sheets to use instead of the shipped ones (specs/029-tui-command-center/contracts/art.md).
  # A sheet that breaks a rule is reported at start and left out. FUKUII_TUI_ART_DIR overrides this.
  # art-dir = "/path/to/art"

  # Where each alert on the alert row, and each health bar, begins. These are the defaults; a key left out keeps its
  # default, a value that is no threshold stops the node at start with the key's name, and so does a key that is none
  # of these (a threshold misspelt is one you believe is set).
  alerts {
    # No handshaked peer for longer than this is an error; fewer than this share of the peer limit is a warning.
    zero-peers-after = 30s
    low-peers-fraction = 0.25
    # Blocks remain and the head has not moved for this long: the sync is stalled.
    stall-after = 120s
    # A SNAP sample older than this while SNAP runs is a warning (the monitor samples every 30 s).
    snap-sample-max-age = 90s
    # Disk free on the datadir's file system: a warning below the first, an error below the second, which must not
    # be above the first.
    disk-warn = 20 GiB
    disk-error = 5 GiB
    # ETH. No forkchoiceUpdated for longer than this: the consensus client is disconnected. How long after its start
    # a node may wait for the first one before a warning. No newPayload for this long while peers are ahead.
    cl-silent-after = 60s
    cl-first-call-grace = 60s
    new-payload-silent-after = 5m
    # ETC. Mining on, the DAG loaded, and a reported hashrate of 0 for longer than this.
    hashrate-zero-after = 10m
    # A reorg at least this many blocks deep is a warning for ten minutes. Every reorg, of any depth, is listed on
    # the Chain view.
    reorg-depth = 3
    # The heap never under this share of its limit for a minute; more than this share of the last minute spent in
    # garbage-collection pauses. Both are judged over the last minute of readings, and not before a minute has been
    # watched; that minute, the ten minutes a reorg stays on the alert row, and the 20 calls below are fixed.
    heap-warn-fraction = 0.90
    gc-share-warn = 0.20
    # More than this share of the last minute's JSON-RPC calls failing, with at least 20 calls in it.
    rpc-error-rate-warn = 0.10
    # Whether the database refusing writes, until its flushes and compactions catch up, is a warning.
    write-stall = true
  }

  # read-only = true: no operator action can run from the TUI, and q does not offer to stop the node (Ctrl-C still
  # does). For wall displays, demos and shared sessions. FUKUII_TUI_READ_ONLY, set to a non-empty value, sets it too.
  read-only = false
}
