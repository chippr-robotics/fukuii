vm {
    # internal | external
    mode = "internal"

    # The library behind the EIP-2537 BLS12-381 precompiles (0x0b-0x11), ETH Prague onward and ETC Olympia (B-151).
    # - auto: eth_pairings (org.hyperledger.besu:bls12-381) where it loads, Linux and macOS; else blst
    #   (tech.pegasys:jblst), which is what Windows runs
    # - eth-pairings: eth_pairings only
    # - blst: blst only
    # Both compute the same bytes (the EIP-2537 differential, Eip2537DifferentialSpec). A chain that needs the
    # precompiles does not start when the chosen library does not load (B-135). A value other than auto,
    # eth-pairings or blst stops the start on every chain, whether or not it needs the precompiles.
    bls12-381-backend = "auto"
    bls12-381-backend = ${?FUKUII_BLS12381_BACKEND}

    external {
      # possible values are:
      # - iele: runs a binary provided at `executable-path` with `port` and `host` as arguments (`./executable-path $port $host`)
      # - kevm: runs a binary provided at `executable-path` with `port` and `host` as arguments (`./executable-path $port $host`)
      # - fukuii: if `executable-path` is provided, it will run the binary with `port` and `host` as arguments
      #           otherwise fukuii VM will be run in the same process, but acting as an external VM (listening at `host` and `port`)
      # - none: doesn't run anything, expect the VM to be started by other means
      vm-type = "fukuii"

      # path to the executable - optional depending on the `vm-type` setting
      executable-path = "./bin/fukuii-vm"

      host = "127.0.0.1"
      port = 8888
    }
  }
