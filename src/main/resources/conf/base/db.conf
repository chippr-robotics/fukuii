 db {
    rocksdb {
      # RocksDB data directory
      path = ${fukuii.datadir}"/rocksdb/"

      # Create DB data directory if it's missing
      create-if-missing = true

      # Should the DB raise an error as soon as it detects an internal corruption
      paranoid-checks = true

      # Compaction parallelism — critical during SNAP sync's write-heavy phase.
      # Each compaction thread can saturate ~100MB/s. With SSD doing 500MB/s, need 4-5 threads.
      # Reference: geth uses 4, erigon uses max(1, numCPU/2), besu uses 4.
      max-threads = 4

      # Max open file descriptors for RocksDB (geth: unlimited, erigon: 512, besu: OS default).
      # 512 avoids FD churn during SNAP sync while staying within ulimit. TUNING (spec 002 US4):
      # a long post-SNAP healing walk does random reads over the state CF, which on a large node can
      # span >1500 SST files; with max-open-files below the SST count RocksDB re-reads each table's
      # index/filter blocks on a cache miss (table-handle churn). If a slow walk shows a low cache
      # hit rate (enable rocksdb.enable-statistics to observe), raise this to >= the on-disk SST
      # count (`ls <datadir>/<state-cf>/*.sst | wc -l`) or -1 for unlimited (geth's default), within
      # the process FD ulimit. Costs open FDs + a little off-heap memory; does NOT threaten the JVM heap.
      max-open-files = 512

      # Checksum verification during reads. During SNAP sync, data is already verified by
      # Merkle proofs, so checksums add overhead. Can be disabled via override during sync.
      verify-checksums = true

      # In this mode, size target of levels are changed dynamically based on size of the last level
      # https://rocksdb.org/blog/2015/07/23/dynamic-level.html
      level-compaction-dynamic-level-bytes = true

      # Block size: 16KB default. Flat slot namespace benefits from 32KB (better compression
      # for sequential key patterns like accountHash++slotHash), but we use a single config
      # for all column families. 16KB is a good compromise.
      block-size = 16384

      # ---------------------------------------------------------------------------------------------
      # RocksDB memory budget (spec 015). ONE LRU cache is shared by every column family. It holds the
      # data, index and filter blocks AND the memtables: a WriteBufferManager charges memtable memory to
      # that cache and flushes when memtables reach their budget (with the opt-in write-buffer-allow-stall
      # it also stops writers until a flush frees memory). So:
      #
      #   cache capacity  = memory-budget                          (if set)
      #                   = block-cache-size + db-write-buffer-size (otherwise; default 512 + 512 MiB = 1 GiB)
      #   memtable budget = db-write-buffer-size                   (capped at capacity / 2 when memory-budget is set)
      #   blocks get      >= capacity - memtable budget, and the whole capacity while memtables are small
      #
      #   RocksDB native ~= capacity
      #                   + memtable overshoot while flushes catch up (zero with write-buffer-allow-stall)
      #                   + pinned entries above capacity (the cache is not strict; L0 index/filter blocks
      #                     are pinned, and with partitioning each file's top-level index/filter block, which
      #                     grows with file size and file count)
      #                   + estimate-table-readers-mem (per open SST file, small with cached index/filter)
      #                   + compaction/flush working buffers (~max-threads x a few block sizes)
      #                   + allocator overhead (glibc arenas; set MALLOC_ARENA_MAX in the service unit)
      #   WAL (max-total-wal-size) is on disk, not in memory.
      #
      # Process RSS ~= -Xmx + -XX:MaxDirectMemorySize + metaspace/code cache (~0.3 GiB) + RocksDB native.
      # 16 GiB ETH-mainnet host: -Xmx8g, MaxDirectMemorySize=512m, memory-budget = 2 GiB leaves ~4 GiB for
      # the page cache and the OS.
      #
      # The cache is deliberately NOT strict-capacity: with a strict limit a full cache fails the insert and
      # RocksDB returns a MemoryLimit error to the read (or memtable reservation) that needed it, which
      # would surface as a storage exception. Memtables are bounded by flushes (and optionally the stall).
      #
      # Watch: app_db_rocksdb_block_cache_usage_bytes (includes memtables), _pinned_usage_bytes,
      # app_db_rocksdb_memtables_size_bytes, app_db_rocksdb_table_readers_mem_bytes.
      # ---------------------------------------------------------------------------------------------

      # Total RocksDB cache budget in bytes (blocks + memtables). Unset by default so existing overrides of
      # block-cache-size / db-write-buffer-size keep their meaning. Set this ONE number to size RocksDB.
      # memory-budget = 2147483648

      # Bytes kept for blocks when memtables are at their budget (ignored when memory-budget is set).
      # TUNING (spec 002 US4): on a node whose state CF is tens of GB, 512MB covers <1% of it, so a
      # random-read healing walk is mostly cache-miss-bound. Raise this ONLY when rocksdb.enable-statistics
      # shows a low block-cache hit rate (do not raise blindly). The cache is OFF-HEAP and counts against the
      # container memory cgroup alongside the JVM heap; see the formula above.
      block-cache-size = 536870912

      # Memtable budget summed across ALL column families. Each of the ~21 column families may hold
      # write_buffer_size x max_write_buffer_number = 64 MiB x 2 on its own (~2.7 GiB in total); this caps
      # the sum. Above it RocksDB flushes and, with write-buffer-allow-stall, writes also wait for the flush.
      db-write-buffer-size = 536870912

      # OPT-IN hard cap: stall writes while memtables exceed db-write-buffer-size. WARNING: a stall freezes
      # ALL reads too. Every write holds the process-wide DataSource lock exclusively around db.write, so a
      # stall blocks every reader (block import, SNAP serving, Engine API, RPC) until a flush completes, which
      # can take tens of seconds on a slow SSD. Enable only on memory-constrained hosts where an OOM kill is
      # worse than a pause. false (default): the WriteBufferManager still flushes at the budget; memtables
      # may overshoot briefly while a flush catches up.
      write-buffer-allow-stall = false

      # OPT-IN (default false for this release). Two-level (partitioned) index + partitioned bloom filters
      # (and allocator-sized filters, optimize_filters_for_memory) for newly written SST files; existing files
      # stay readable as they are and are rewritten by normal compaction. Turning it off again is also safe.
      # Whole-file filters run ~2.7% of the SST size (Sepolia, 20 GB DB: 119 MB of filters in a 512 MB
      # cache); on an ETH-mainnet DB they cannot all fit, and a whole filter must be loaded to answer one
      # lookup. With partitioning each file's top-level index/filter block is pinned (about one entry per
      # partition, so it grows with file size and count) and the partitions are cached and evicted like
      # data blocks.
      partition-index-and-filters = false

      # Size of one index/filter partition (bytes); used only with partition-index-and-filters.
      metadata-block-size = 4096

      # Cap on total live WAL across column families. Also forces a flush of the laggard
      # CF so the memtable pinning the oldest WAL is released rather than accumulating.
      max-total-wal-size = 536870912

      # When true, attach a RocksDB Statistics object so block-cache hit/miss tickers become
      # observable (exposed via RocksDbDataSource.cacheStats; spec 002 US2 / FR-005). Off by default:
      # statistics add ~1-2% read overhead, so enable this only to diagnose a slow heal walk — e.g. to
      # confirm whether the post-SNAP healing walk is cache-miss-bound before raising max-open-files or
      # block-cache-size above.
      enable-statistics = false
    }

    # Define which database to use [rocksdb]
    data-source = "rocksdb"

    # Run database checks every 10 mins and shut down when an inconsistency is found
    periodic-consistency-check = false
  }