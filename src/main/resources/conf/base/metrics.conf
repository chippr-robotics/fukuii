metrics {
  # Set to `true` if your deployment supports metrics collection.
  # We expose metrics using a Prometheus server
  # We default to `false` here because we do not expect all deployments to support metrics collection.
  enabled = false

  # The port of the Prometheus endpoint: http://<interface>:13798/metrics by default.
  port = 13798

  # The address the endpoint binds (spec 030). Loopback by default; set it to an address, or "0.0.0.0", for a
  # Prometheus server on another host, preferably with TLS below.
  interface = "localhost"

  # TLS for the endpoint, as for network.rpc.http.tls: a profile under fukuii.tls.profiles holds the keystore and, for
  # client-auth = want or need, the truststore of the scrapers' certificates. docs/runbooks/tls-operations.md
  tls {
    enabled = false
    profile = null
    client-auth = "none"
  }
}

kamon {
  modules {
    # We expose Prometheus metrics via the node's Micrometer-backed
    # io.prometheus.client.HTTPServer in Metrics.scala. Disable Kamon's own
    # Prometheus reporter so it doesn't double-register or contend for the port.
    prometheus-reporter {
      enabled = no
    }
  }

  prometheus {
    # The reference.conf from kamon-prometheus 2.7.x uses
    # `start-embedded-http-server` (yes/no) — there is no `embedded-server.enabled`
    # key. Without this, kamon binds 0.0.0.0:9095 (its default port), which
    # collides with multi-instance setups where 9095 is the per-instance metrics
    # port and produces "Address already in use" on the second chain.
    start-embedded-http-server = no
  }

  instrumentation.pekko.filters {

    actors.track {
      includes = [ "fukuii_system/user/*" ]
    }

    dispatchers {
      includes = ["**"]
    }

    routers {
      includes = ["**"]
    }

    groups {
      worker-actors {
        includes = [ "fukuii_system/user/*" ]
      }
    }
  }
}

kanela.show-banner = false
