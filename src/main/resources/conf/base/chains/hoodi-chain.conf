{
  # Hoodi testnet (post-Merge PoS from genesis, via consensus layer; launched 2025-03-17).
  # Sources (fetched 2026-11-12, spec 028 R15): eth-clients/hoodi metadata/genesis.json and
  # config.yaml, go-ethereum params.HoodiChainConfig, and block 0 from the public Hoodi RPCs.
  # Pinned by HoodiGenesisSpec (genesis hash, state root) and ForkIdHoodiSpec (fork ids).
  network-id = 560048
  chain-id = "0x88bb0"
  network-type = "eth"

  # Merged at genesis (go-ethereum HoodiChainConfig: TerminalTotalDifficulty 0, mergeNetsplitBlock 0).
  terminal-total-difficulty = "0"

  # Timestamp forks (EIP-6122). Shanghai and Cancun are active at genesis (shanghaiTime = cancunTime = 0), which is
  # before the genesis timestamp 1742212800, so they are not fork-id checksum entries; the chain starts at Prague.
  # go-ethereum core/forkid/forkid_test.go, "Hoodi test cases", pinned in ForkIdHoodiSpec:
  #   genesis..Cancun 0xbef71d30 next 1742999832 | Prague 0x0929e24e | Osaka 0xe7e0e7ff | BPO1 0x3893353e | BPO2 0x23aa1351
  shanghai-timestamp = 0
  cancun-timestamp = 0
  prague-timestamp = 1742999832
  osaka-timestamp = 1761677592
  bpo1-timestamp = 1762365720
  bpo2-timestamp = 1762955544

  # EIP-7840 / EIP-7892 blob schedule (go-ethereum master params.HoodiChainConfig.BlobScheduleConfig
  # = Default{Cancun,Prague,BPO1,BPO2}BlobConfig; eth-clients/hoodi metadata/genesis.json blobSchedule; byte-identical to Sepolia's).
  # Osaka and Amsterdam inherit the latest entry.
  blob-schedule {
    cancun { target = 3, max = 6, base-fee-update-fraction = 3338477 }
    prague { target = 6, max = 9, base-fee-update-fraction = 5007716 }
    bpo1 { target = 10, max = 15, base-fee-update-fraction = 8346193 }
    bpo2 { target = 14, max = 21, base-fee-update-fraction = 11684671 }
  }

  # No Amsterdam: neither eth-clients/hoodi nor go-ethereum schedules it (2026-11-12).

  # EIP-6110 beacon deposit contract: eth-clients/hoodi (deposit_contract_block_hash / genesis alloc), the
  # mainnet address. Execution scans it for DepositEvent logs (BlockExecution.depositContractFor).
  deposit-contract-address = "0x00000000219ab540356cBB839Cbe05303d7705Fa"

  # go-ethereum HoodiChainConfig: MergeNetsplitBlock 0. Genesis-active, so filtered from the fork-id chain.
  merge-netsplit-block-number = "0"

  pow-target-time = null

  frontier-block-number = "0"
  homestead-block-number = "0"
  eip106-block-number = "1000000000000000000"
  eip150-block-number = "0"
  eip155-block-number = "0"
  eip160-block-number = "0"
  eip161-block-number = "0"

  max-code-size = "24576"

  difficulty-bomb-pause-block-number = "1000000000000000000"
  difficulty-bomb-continue-block-number = "1000000000000000000"
  difficulty-bomb-removal-block-number = "1000000000000000000"

  byzantium-block-number = "0"
  constantinople-block-number = "0"
  petersburg-block-number = "0"
  istanbul-block-number = "0"
  muir-glacier-block-number = "1000000000000000000"
  berlin-block-number = "0"

  # ETC-specific forks (disabled)
  atlantis-block-number = "1000000000000000000"
  agharta-block-number = "1000000000000000000"
  phoenix-block-number = "1000000000000000000"
  ecip1099-block-number = "1000000000000000000"
  magneto-block-number = "1000000000000000000"
  mystique-block-number = "1000000000000000000"
  spiral-block-number = "1000000000000000000"

  # London (EIP-1559) from genesis on Hoodi
  olympia-block-number = "0"

  # EIP-1559 elasticity multiplier applied ONCE, at the London activation block:
  # that block validates its +/-1/1024 gas-limit window against parent.gasLimit * 2
  # (go-ethereum consensus/misc/eip1559.go VerifyEip1559Header). Absent on ETC chains.
  olympia-gas-limit-elasticity = 2

  treasury-address = "0000000000000000000000000000000000000000"

  account-start-nonce = "0"

  # Block 0 hash, go-ethereum params.HoodiGenesisHash = eth-clients/hoodi. Pinned by HoodiGenesisSpec.
  genesis-hash = "0xbbe312868b376a3001692a646dd2d7d1e4406380dfd86b98aa8a34d1557c971b"

  # `genesis-hash` and `consensus` are for spec 028 FR-022 / spec 024's chain registry; nothing reads these keys yet.
  # The header validator is selected by `mining.protocol = "engine-api"` in conf/hoodi.conf.
  consensus = "engine-api"

  custom-genesis-file = { include required("hoodi-genesis.json") }

  monetary-policy {
    first-era-block-reward = "0"
    first-era-reduced-block-reward = "0"
    first-era-constantinople-reduced-block-reward = "0"
    era-duration = 2000000000
    reward-reduction-rate = 0
  }

  gas-tie-breaker = false
  eth-compatible-storage = true

  # EIP-1459 DNS-based peer discovery. all.hoodi.ethdisco.net is the Ethereum Foundation's tree for Hoodi
  # (go-ethereum params/bootnodes.go), signed with the same EF key as Sepolia's; DnsTrustAnchors.shipped carries it.
  dns-discovery-domains = [
    "all.hoodi.ethdisco.net"
  ]

  # Static bootnodes, all with a real TCP port. eth-clients/hoodi enodes.yaml also lists five EF NodeOps enodes as
  # `@ip:0?discport=N` (TCP port 0). HoodiBootnodeSpec pins that fukuii would hand those to the dialler with port 0
  # (PeerManagerActor ConnectToPeerCmd), which can never connect, so they are NOT listed here: DNS discovery
  # finds the NodeOps nodes through their ENRs instead.
  # Sources: go-ethereum params/bootnodes.go HoodiBootnodes (the three legacy EF enodes) and eth-clients/hoodi
  # enodes.yaml (Lodestar).
  bootstrap-nodes = [
    "enode://2112dd3839dd752813d4df7f40936f06829fc54c0e051a93967c26e5f5d27d99d886b57b4ffcc3c475e930ec9e79c56ef1dbb7d86ca5ee83a9d2ccf36e5c240c@134.209.138.84:30303",
    "enode://60203fcb3524e07c5df60a14ae1c9c5b24023ea5d47463dfae051d2c9f3219f309657537576090ca0ae641f73d419f53d8e8000d7a464319d4784acd7d2abc41@209.38.124.160:30303",
    "enode://8ae4a48101b2299597341263da0deb47cc38aa4d3ef4b7430b897d49bfa10eb1ccfe1655679b1ed46928ef177fbf21b86837bd724400196c508427a6f41602cd@134.199.184.23:30303",
    "enode://e9e62e53861ee404eaca33e5d3f110e6f6d45c34229ec8e83060b1b35959df8412267f1d73f0a37597b4e5c5c5cf1f69da8631c62d38da290139a7120ee15e37@65.21.201.146:30303" # lodestar
  ]

  mess {
    enabled = false
  }
}
