{
  # Ethereum Mainnet (post-Merge PoS via consensus layer)
  network-id = 1
  chain-id = "0x01"
  network-type = "eth"

  # Terminal Total Difficulty (The Merge, block 15537394)
  terminal-total-difficulty = "58750000000000000000000"

  # Timestamp-based forks (post-Merge). Verified against go-ethereum master
  # 5b5c9d06810f8dfcc092e8d1c35b34c11fa9b8fe (2026-09-22), params/config.go MainnetChainConfig:
  # ShanghaiTime/CancunTime/PragueTime/OsakaTime/BPO1Time/BPO2Time below; AmsterdamTime is not
  # set there, so it is not set here.
  #
  # Every one of these enters the EIP-2124 fork-id checksum chain. Before Osaka/BPO1/BPO2 were
  # declared, fukuii's mainnet fork id stopped at Prague (0xc376cf8b, no next fork) while every
  # mainnet peer past 2025-12-03 announces 0x5167e2a6 or later — "wrong fork ID in status" — and
  # fukuii ran none of Osaka's rules (CLZ, EIP-7918 blob fee, EIP-7825 tx gas cap, ...) on mainnet.
  # Pinned against go-ethereum core/forkid/forkid_test.go's mainnet table in ForkIdEthMainnetSpec.
  #
  # Blob parameters are not configured per chain: BlobGasUtils keys them off these timestamps and
  # carries geth's DefaultCancun/Prague/BPO1/BPO2BlobConfig, which is exactly what
  # MainnetChainConfig.BlobScheduleConfig references (Osaka reuses Prague's; BPO1 10/15/8346193,
  # BPO2 14/21/11684671).
  shanghai-timestamp = 1681338455   # 2023-04-12 22:27:35 UTC
  cancun-timestamp  = 1710338135   # 2024-03-13 13:55:35 UTC
  prague-timestamp  = 1746612311   # 2025-05-07 10:05:11 UTC — Pectra (Prague EL + Electra CL)
  osaka-timestamp   = 1764798551   # 2025-12-03 21:49:11 UTC — Fusaka (Osaka EL + Fulu CL)
  bpo1-timestamp    = 1765290071   # 2025-12-09 14:21:11 UTC — EIP-7892 blob parameter fork 1
  bpo2-timestamp    = 1767747671   # 2026-01-07 01:01:11 UTC — EIP-7892 blob parameter fork 2

  pow-target-time = null

  frontier-block-number = "0"
  homestead-block-number = "1150000"
  eip106-block-number = "1000000000000000000"
  eip150-block-number = "2463000"
  eip155-block-number = "2675000"
  eip160-block-number = "2675000"
  eip161-block-number = "2675000"

  max-code-size = "24576"

  difficulty-bomb-pause-block-number = "1000000000000000000"
  difficulty-bomb-continue-block-number = "1000000000000000000"
  difficulty-bomb-removal-block-number = "1000000000000000000"

  byzantium-block-number = "4370000"
  constantinople-block-number = "7280000"
  petersburg-block-number = "7280000"
  istanbul-block-number = "9069000"
  muir-glacier-block-number = "9200000"
  berlin-block-number = "12244000"

  # EIP-4345 (Arrow Glacier) and EIP-5133 (Gray Glacier): difficulty-bomb delays.
  # They change no EVM or state rule and fukuii never implemented ETH's bomb schedule
  # (mainnet is post-merge PoS, where difficulty is fixed at 0), but go-ethereum's
  # `gatherForks` enumerates every *Block field of ChainConfig, so both belong in the
  # EIP-2124 fork-id checksum chain.
  #
  # Without them fukuii computed 0x8e91a3e4 at a Prague head where every mainnet peer
  # computes 0xc376cf8b, so the ETH/68 status exchange was rejected with
  # "wrong fork ID in status" — i.e. fukuii could not peer on ETH mainnet at all at any
  # head past Arrow Glacier (block 13773000, December 2021).
  #
  # Sepolia declares neither fork and is unaffected; see ForkIdSepoliaSpec.
  arrow-glacier-block-number = "13773000"
  gray-glacier-block-number = "15050000"

  # ETC-specific forks (disabled on ETH)
  atlantis-block-number = "1000000000000000000"
  agharta-block-number = "1000000000000000000"
  phoenix-block-number = "1000000000000000000"
  ecip1099-block-number = "1000000000000000000"
  magneto-block-number = "1000000000000000000"
  mystique-block-number = "1000000000000000000"
  spiral-block-number = "1000000000000000000"

  # London (EIP-1559 baseFee) at block 12965000
  olympia-block-number = "12965000"

  # EIP-1559 elasticity multiplier applied ONCE, at the London activation block:
  # that block validates its +/-1/1024 gas-limit window against parent.gasLimit * 2
  # (go-ethereum consensus/misc/eip1559.go VerifyEip1559Header). Absent on ETC chains.
  olympia-gas-limit-elasticity = 2

  treasury-address = "0000000000000000000000000000000000000000"

  dao {
    fork-block-number = "1920000"
    fork-block-hash = "94365e3a8c0b35089c1d1195081fe7489b528a84b22199c916180db8b28ade7f"
    block-extra-data = null
    block-extra-data-range = 10
    refund-contract-address = null
    drain-list = null
    # TRUE on ETH: mainnet applied the DAO fork, so go-ethereum carries
    # DAOForkSupport=true and `gatherForks` puts block 1920000 into the EIP-2124
    # checksum chain. This key is `false` on etc-chain.conf for the opposite and
    # equally correct reason — ETC rejected the DAO bailout, so 1920000 is not a fork
    # transition on that chain — and the ETH config inherited that `false` from it.
    #
    # Verified against two independently published mainnet fork ids: with 1920000 the
    # Shanghai head checksum is 0xdce96c2d and Cancun is 0x9f3d2254, both exact. Without
    # it neither matches and fukuii cannot complete an ETH status exchange.
    include-on-fork-id-list = true
  }

  account-start-nonce = "0"
  custom-genesis-file = null

  monetary-policy {
    first-era-block-reward = "5000000000000000000"
    first-era-reduced-block-reward = "3000000000000000000"
    first-era-constantinople-reduced-block-reward = "2000000000000000000"
    era-duration = 2000000000
    reward-reduction-rate = 0
  }

  gas-tie-breaker = false
  eth-compatible-storage = true

  bootstrap-nodes = [
    "enode://d860a01f9722d78051619d1e2351aba3f43f943f6f00718d1b9baa4101932a1f5011f16bb2b1bb35db20d6fe28fa0bf09636d26a87d31de9ec6203eeedb1f666@18.138.108.67:30303",
    "enode://22a8232c3abc76a16ae9d6c3b164f98775fe226f0917b0ca871128a74a8e9630b458460865bab457221f1d448dd9791d24c4e5d88786180ac185df813a68d4de@3.209.45.79:30303"
  ]

  mess {
    enabled = false
  }
}
