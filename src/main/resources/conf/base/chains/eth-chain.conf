    # TRUE on ETH: mainnet applied the DAO fork, so go-ethereum carries
    # DAOForkSupport=true and `gatherForks` puts block 1920000 into the EIP-2124
    # checksum chain. This key is `false` on etc-chain.conf for the opposite and
    # equally correct reason — ETC rejected the DAO bailout, so 1920000 is not a fork
    # transition on that chain — and the ETH config inherited that `false` from it.
    #
    # Verified against two independently published mainnet fork ids: with 1920000 the
    # Shanghai head checksum is 0xdce96c2d and Cancun is 0x9f3d2254, both exact. Without
    # it neither matches and fukuii cannot complete an ETH status exchange.
    include-on-fork-id-list = true
