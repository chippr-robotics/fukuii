{
  # Platåberget — the first public Glamsterdam (Amsterdam EL + Gloas CL) testnet.
  # Post-Merge PoS from genesis, driven by a consensus-layer client over the Engine API.
  # Launched 2026-08-17 on the glamsterdam-devnet-8 spec; ethpandaops-operated, intended to
  # run "a few months" ahead of the Sepolia/Hoodi/mainnet Glamsterdam upgrades.
  #
  # Source of truth (every value below was taken from, or checked against, these):
  #   - https://plataberget.dev/  (names the config below as the network's source)
  #   - https://github.com/ethpandaops/glamsterdam-devnets/tree/master/network-configs/devnet-8/metadata
  #     (genesis.json -> plataberget-genesis.json, enodes.txt -> bootstrap-nodes)
  #   - https://blog.ethereum.org/2026/08/17/plataberget-testnet
  #   - Live RPC https://rpc.plataberget.ethpandaops.io (2026-09-24): eth_chainId 0x1a6a8cc6e,
  #     net_version 7091047534, block 0 hash 0xee33ef92…2b31, eth_config current.forkId 0x05842a50.
  #
  # The ASCII slug `plataberget` matches the ethpandaops hostnames (*.plataberget.ethpandaops.io),
  # ethstaker-deposit-cli (`--chain plataberget`) and other clients' named-network flags.
  network-id = 7091047534
  chain-id = "0x1a6a8cc6e"
  network-type = "eth"

  # Merged at genesis (geth config: terminalTotalDifficulty 0, terminalTotalDifficultyPassed true).
  terminal-total-difficulty = "0"

  # Timestamp forks (EIP-6122). Every fork through Osaka/BPO1/BPO2 is active at genesis
  # (geth config shanghaiTime..bpo2Time = 0). Forks at or before the genesis timestamp
  # (1786622400) are part of the genesis ruleset and are NOT fork-id checksum entries, so
  # the checksum chain holds exactly one fork: Amsterdam.
  #   pre-Amsterdam : ForkId(0x94ebe4ed, next 1787212224) = CRC32(genesis hash)
  #   Amsterdam+    : ForkId(0x05842a50, next 0)          — matches the live network's eth_config
  shanghai-timestamp = 0
  cancun-timestamp = 0
  prague-timestamp = 0
  osaka-timestamp = 0
  bpo1-timestamp = 0
  bpo2-timestamp = 0

  # Glamsterdam: amsterdamTime 1787212224 = 2026-08-20 07:50:24 UTC = Gloas epoch 1536
  # (genesis + 49,152 slots). Blob parameters at Amsterdam stay at BPO2's 14/21/11684671 —
  # the genesis blobSchedule declares no Amsterdam entry, and eth_config reports exactly that.
  amsterdam-timestamp = 1787212224

  # geth config: mergeNetsplitBlock 0. Genesis-active, so filtered from the fork-id chain.
  merge-netsplit-block-number = "0"

  # EIP-6110 deposit contract (geth config.depositContractAddress). Same address as mainnet,
  # declared explicitly because it is genesis-declared, not a constant.
  deposit-contract-address = "0x00000000219ab540356cBB839Cbe05303d7705Fa"

  sync {
    do-fast-sync = false
    do-snap-sync = false
  }

  pow-target-time = null

  # Every pre-Merge block fork is active at genesis. Each value is either "0" (genesis-active)
  # or the 10^18 "never" sentinel — both are filtered by ForkId.gatherBlockForks, so this
  # chain carries no block forks at all and the checksum chain reaches the timestamp forks.
  frontier-block-number = "0"
  homestead-block-number = "0"
  eip106-block-number = "1000000000000000000"
  eip150-block-number = "0"
  eip155-block-number = "0"
  eip160-block-number = "0"
  eip161-block-number = "0"

  # Pre-Amsterdam limit. EIP-7954 raises it at the Amsterdam timestamp in code, not here.
  max-code-size = "24576"

  difficulty-bomb-pause-block-number = "1000000000000000000"
  difficulty-bomb-continue-block-number = "1000000000000000000"
  difficulty-bomb-removal-block-number = "1000000000000000000"

  byzantium-block-number = "0"
  constantinople-block-number = "0"
  petersburg-block-number = "0"
  istanbul-block-number = "0"
  muir-glacier-block-number = "1000000000000000000"
  berlin-block-number = "0"

  # ETC-specific forks (disabled)
  atlantis-block-number = "1000000000000000000"
  agharta-block-number = "1000000000000000000"
  phoenix-block-number = "1000000000000000000"
  ecip1099-block-number = "1000000000000000000"
  magneto-block-number = "1000000000000000000"
  mystique-block-number = "1000000000000000000"
  spiral-block-number = "1000000000000000000"

  # London (EIP-1559) from genesis. MUST be "0", not the 10^18 sentinel: ForkId re-appends an
  # Olympia sentinel as the advertised next fork, which would halt the checksum chain before
  # Amsterdam and send every Platåberget peer the wrong fork id.
  olympia-block-number = "0"

  # EIP-1559 elasticity at the London activation block. London is the genesis block here, so
  # no validated block ever takes this branch; declared for parity with the other ETH chains.
  olympia-gas-limit-elasticity = 2

  treasury-address = "0000000000000000000000000000000000000000"

  account-start-nonce = "0"

  # Converted from ethpandaops devnet-8 genesis.json: alloc (286 accounts) verbatim; header
  # fields re-encoded for GenesisDataLoader, which parses `timestamp` as HEX (upstream writes
  # the decimal string "1786622400"). Expected: hash 0xee33ef92bbabcf07bcf44fea1d18a7925c5f7f9da8f81334ea19b0f3cb892b31,
  # state root 0x9a527aee5d0f6b0c73b240e77c134cae1fd47ceaa90db223edd598866e269c47.
  custom-genesis-file = { include required("plataberget-genesis.json") }

  monetary-policy {
    first-era-block-reward = "0"
    first-era-reduced-block-reward = "0"
    first-era-constantinople-reduced-block-reward = "0"
    era-duration = 2000000000
    reward-reduction-rate = 0
  }

  gas-tie-breaker = false
  eth-compatible-storage = true

