sync {
  # How a node without a synced chain catches up:
  #   true  - SNAP sync: download recent state from snap-capable peers, then import blocks from there.
  #   false - regular sync: import and execute every block (from genesis on a new node).
  # (Fast sync was removed; `do-fast-sync` is ignored with a warning.)
  do-snap-sync = true
  # Use validated checkpoint block hashes to skip header chain verification back to genesis.
  # Reduces initial sync time significantly. Requires bootstrap-checkpoints to be set in the
  # network-specific conf (ops/*/etc.conf, mordor.conf, etc). Safe: checkpoints are pre-verified.
  use-bootstrap-checkpoints = true

  # SNAP sync configuration
  # SNAP sync is a state synchronization protocol that downloads account and storage ranges
  # without intermediate Merkle trie nodes, significantly reducing sync time and bandwidth.
  # See: https://github.com/ethereum/devp2p/blob/master/caps/snap.md
  snap-sync {
    # Enable SNAP sync (requires do-snap-sync = true)
    enabled = true
    # Phase 2 of the SNAP rewrite (geth-style streaming MPT construction).
    # When true, the AccountRange and StorageRange coordinators build per-task
    # Number of blocks before the best block to use as pivot for SNAP sync
    # Core-geth uses 64 blocks (fsMinFullBlocks) as the minimum threshold
    # This allows SNAP sync to start much sooner after genesis
    # A higher offset provides more stability against chain reorgs
    # A lower offset reduces the catch-up time after SNAP sync completes
    # Changed from 1024 to 64 to match core-geth exactly
    pivot-block-offset = 64
    # Number of concurrent account range download tasks
    # Higher values increase throughput but may overwhelm peers
    # Recommended: 16 tasks (divides 256-bit address space into 16 ranges)
    account-concurrency = 16
    # Number of concurrent storage range download tasks
    # Storage downloads are typically less voluminous than accounts
    # Recommended: 8 tasks (balances throughput with peer load)
    storage-concurrency = 16
    # Maximum number of accounts to request storage for in a single batch.
    # The SNAP spec explicitly supports multi-account GetStorageRanges: "The request supports
    # querying multiple contracts at the same time as most storage tries are in the order of
    # 100s of bytes." Geth packs hundreds of small contracts per request. Higher values
    # dramatically reduce round trips for the ~95% of contracts with <100 storage slots.
    # With batch=128 and 130K contracts: ~1K requests vs 16K at batch=8 (16x fewer round trips).
    # The coordinator adaptively reduces batch size per-peer when a peer can't handle batched requests.
    storage-batch-size = 128
    # Initial response size hint for GetStorageRanges requests (bytes).
    # Higher values pack more small-contract storage into each response. Geth's snap handler
    # supports up to 2MB. Starting at 1MB (vs 512KB for accounts) because storage responses
    # are denser (no account bodies, just slot hash+value pairs).
    storage-initial-response-bytes = 1048576
    # Minimum response size floor for GetStorageRanges requests (bytes).
    # Prevents excessive small requests after repeated ratchet-downs on slow peers.
    storage-min-response-bytes = 131072
    # Cap on per-account streaming storage tries held in memory at once. Each `SnapHashTrie`
    # bounds its working set to ~8 MiB (DefaultBatchSizeBytes); the worst-case storage-processing
    # footprint is `max-concurrent-storage-accounts × 8 MiB`. Default 256 → ~2 GiB ceiling,
    # independent of chain size. Storage dispatch defers brand-new accounts when at the cap;
    # continuations for in-flight accounts still proceed. Lift this for big peer pools and
    # generous heap (-Xmx ≥ 6g); lower it on small heaps.
    max-concurrent-storage-accounts = 256
    # Deferred Merkleization: skip MPT trie construction during download, write only to flat
    # storage. Tries are built in a single batch pass after all storage downloads complete.
    # This maximizes network throughput by eliminating CPU-bound trie ops during download.
    # Tradeoff: individual storage roots cannot be verified during download (healing corrects).
    # Inspired by Nethermind's Paprika approach and Besu's state-trie-less sync PoC.
    #
    # IMPORTANT: false is the correct production default. Setting true skips the healing phase
    # and builds the trie lazily during block execution, causing GC death spirals on mainnet
    # (confirmed: ETC Attempt 25 required SIGKILL after 3h frozen at block 24,452,253).
    # With false, healing runs to completion before regular sync starts — matching Besu and
    # go-ethereum's architecture where block import is gated on state completeness.
    # Requires a SNAP-capable peer serving GetTrieNodes (e.g. local Besu --snapsync-server-enabled).
    deferred-merkleization = false
    # Post-SNAP storage recovery: before abandoning gaps it can't download against the aged pivot
    # root (whose ~128-block / ~27-min serve window has expired by the time a multi-hour scan ends),
    # recovery rolls its download root onto a recent canonical root that peers can still serve. Cold
    # contracts fill identically (trie nodes are content-addressed); a hot-only/peerless residue is
    # left for regular sync's on-demand GetTrieNodes. This bounds the number of rolls so recovery
    # always terminates. 0 disables rolling (legacy abandon-only behaviour).
    storage-recovery-max-root-rolls = 8
    # Post-SNAP recovery scan: true (default) runs ONE combined parallel single-pass scan that checks
    # both bytecode and storage per account, sharded across `recovery-scan-concurrency` workers and
    # persisting per-shard progress so a crash resumes from the last completed shard. Replaces the two
    # legacy single-threaded full-trie walks (~2× faster, resumable). false = legacy per-phase scan.
    parallel-recovery-scan = true
    # Worker count for the combined scan (reserve a core for the live node on a 4-core box).
    recovery-scan-concurrency = 3
    # Trie partition depth for sharding (1 = up to 16 shards).
    recovery-scan-shard-depth = 1
    # Maximum number of trie node paths per healing request.
    # go-ethereum uses 1024, Besu uses 384. With healing-max-inflight-per-peer=1
    # (serialize per peer like both reference clients), throughput comes from batch
    # size rather than pipelining. 128 is conservative and fits Besu's 4s response window.
    healing-batch-size = 128
    # Number of concurrent trie node healing workers
    # Higher values increase healing throughput during the final phase
    # Recommended: 16 workers (matches account/storage concurrency)
    healing-concurrency = 16
    # Maximum concurrent GetTrieNodes requests per healing peer.
    # Both go-ethereum and Besu serialize per peer (1 request at a time) and use large
    # batch sizes for throughput. Pipelining 5 requests simultaneously causes all 5 to
    # timeout together, jumping peerConsecutiveTimeouts from 0→5 in one batch and
    # triggering the stateless/pivot-refresh cycle against peers that do have state.
    healing-max-inflight-per-peer = 1
    # Max entries in the post-SNAP frontier-rebuild walk's `visited` set (FIFO/insertion-order
    # eviction, NOT an LRU). On restart, healing rediscovers the missing-node frontier by walking the
    # full state trie (accounts + every storage trie — 35M+ nodes on ETC mainnet). An unbounded
    # visited set grew to ~2.9 GB and OOM-looped the node; this bounds it. Budget ≈ cap × ~120-150 B
    # (a 32-byte hash + ByteString wrapper + map entry), so 4,000,000 ≈ 480-640 MB (NOT the ~320 MB an
    # 80 B/entry estimate implies). Lower on small heaps (more re-walks of shared subtries, still
    # complete); raise ONLY from a measured `inflation_ratio` (app_snapsync.healing.inflation_ratio,
    # spec 002 US2) and within the heap budget — e.g. do NOT set 20,000,000 (~2.4-3.2 GB) on a 6 GB
    # heap (it OOMs). Completeness is independent of this value. See docs/design/healing-frontier-scale.md.
    healing-visited-cap = 4000000
    # Persist the outstanding healing frontier to a dedicated column family so a restart resumes
    # (O(frontier)) instead of re-walking the full state trie (O(full state) — days on ETC mainnet).
    # On restart, a non-empty, readable persisted frontier is loaded and the full DFS is skipped;
    # an empty, absent, or corrupt frontier falls back to the full walk. Default false (ships dark);
    # the new column family auto-creates on next DB open (no datadir migration).
    healing-frontier-persistence = true
    # Operator ceiling for BFS level parallelism. Large trie levels (> BfsChunkSize = 50K) are split
    # into up to this many sub-ranges processed concurrently on healing-reader-dispatcher (the parent
    # walk parks on healing-writer-dispatcher waiting for them — a separate pool prevents starvation).
    # Effective = min(this, min(nproc, max(healing-min-parallelism, nproc - healing-reserved-cores))):
    # auto-throttles on smaller hardware. Set to 1 to force sequential processing.
    healing-traversal-parallelism = 4
    # Floor on effective BFS parallelism: even on a host with few spare cores, large levels still split
    # into at least this many sub-ranges (capped by healing-traversal-parallelism and the CPU count).
    healing-min-parallelism = 2
    # Cores held back for the live node + GC, subtracted from availableProcessors before the
    # min-parallelism floor. On the 4-core reference host: max(2, 4 - 2) = 2.
    healing-reserved-cores = 2

    # Frontier-emission backpressure (OOM gate, 2026-06-13 incident). The BFS healing walk reads
    # the local trie far faster than healing fetches missing nodes from a peer-scarce SNAP network;
    # without a gate, a walk that re-discovers a large frontier floods the actor mailbox / pending
    # queue until the JVM heap is exhausted. The walk pauses emitting once the healing backlog
    # reaches the high-water mark and resumes below the low-water mark (geth trie.Sync
    # maxFetchesPerDepth analogue). ~100K entries bounds discovered-but-unhealed heap to tens of MB.
    healing-frontier-high-water = 100000
    healing-frontier-low-water = 50000
    # Post-SNAP healing livelock fix (2026-06-14). When true (default), a healing STAGNATION — slow progress,
    # NOT an unservable root — HOLDS the healing pivot fixed and resumes dispatch against the held root instead
    # of rolling the pivot. Why: on slow / peer-scarce ETC nodes the completion gate requires a verification BFS
    # (~16-20h re-reading ~90M nodes on a slow SSD) to find zero missing nodes against the CURRENT root, but the
    # pivot rolls every ~28 min (snap serve window). Each stagnation-driven roll resets verificationPassComplete
    # and orphans the in-flight BFS, so a clean pass can NEVER coincide with a quiet inter-roll window — healing
    # livelocks and regular sync is never reached, even though the missing nodes themselves DO heal (durable,
    # content-addressed). Holding is consensus-safe: GetTrieNodes fetches missing nodes BY HASH, so a stale root
    # stays ~99.9% servable by current peers; after healing converges, regular sync executes blocks forward and
    # fetches any residual missing node on-demand by hash. The GENUINE all-peers-stateless roll is UNAFFECTED —
    # if the held root truly becomes unservable by ALL peers, healing still rolls. Set false to restore the
    # legacy roll-on-stagnation behaviour.
    heal-hold-pivot-on-stagnation = true
    # Scoped post-heal verification (spec 003). When true (default), the post-heal completion
    # verification re-walks ONLY the subtrees rooted at the nodes healed THIS round instead of
    # re-seeding the state ROOT and re-walking the whole ~90M-node trie (~16-20h on slow storage).
    # It engages ONLY when the durable completeness marker proves a prior full-trie walk ran clean
    # against the current root AND the healed-paths set is non-empty, in-bound, and same-root;
    # otherwise it falls back to the UNCHANGED full-root verification (provably no less safe than
    # today). Byte-for-byte parity of the completion decision / state root / marker is preserved
    # (the full-root path and the completion declaration are untouched). Set false to force the
    # conservative full-root verification on every round.
    scoped-heal-verification = true
    # Upper bound on the in-memory healed-paths set (spec 003 FR-011). If a single round heals more
    # than this many distinct nodes, the set is NOT grown — the round falls back to full-root
    # verification (which covers everything), bounding the worst-case heap of the set. The typical
    # healed set is ~100-200 nodes, so 200000 is generous yet bounds the set to tens of MB.
    scoped-heal-max-paths = 200000
    # Decoupled heal serve-root (spec 004). When true (default), the healing fetch (GetTrieNodes) targets an
    # advancing "serve root" (newest-servable, networkBest-64) while the completeness WALK stays pinned to the
    # fixed walk root. This generalizes heal-hold-pivot-on-stagnation: a walk that outlives the snap serve
    # window still completes, because missing nodes are fetched from a root peers can still serve while
    # completeness is judged solely against the walk root. Consensus-safe: GetTrieNodes is content-addressed —
    # a returned node is stored ONLY if keccak256(node) == the walk root's requested task hash, so a serve root
    # that resolves a path to a different node fails the hash check and is dropped. When false, the fetch uses
    # the walk root (coupled / pre-spec-004 behaviour), byte-identical to today.
    decoupled-heal-serve-root = true
    # FR-006 surfacing threshold (spec 004). A heal task that no serve root can satisfy is RE-QUEUED indefinitely
    # (never force-completed — that would declare success with a real gap). After this many unsatisfied attempts
    # with NO serve-root advance in between, the coordinator emits a surfacing WARN log + metric so operators can
    # see the stuck node. A serve-root refresh resets the per-task counter (a legitimate retry trigger).
    decoupled-heal-max-attempts-no-refresh = 12
    # Moving-root delta heal (spec 009). PLUMBING ONLY so far — NO code reads this flag yet, so it is byte-for-byte
    # behavior-neutral until the behavior hunks land in later batches. When wired (ETC SNAP default true), the heal
    # will complete toward AND fetch against ONE current served root (no separate walk/serve split): the GetTrieNodes
    # fetch root collapses to the completeness root, an absent heal root is seeded+fetched, and top-down discovery is
    # the sole seed. When false, the heal uses the spec-004 walk/serve split.
    moving-root-delta-heal = true
    # Pruned (descend-and-stop) heal verification (spec 005). When true (default), the completeness
    # verification walk treats any present node that carries a durable per-subtree-complete record
    # (CF 'g', content-addressed, root-independent) as a verified frontier leaf and does NOT descend
    # into its subtree — so the proof costs O(missing-frontier) instead of O(whole ~90M-node trie),
    # collapsing the ~16-20h full re-walk to minutes (matching geth/nethermind/besu). Records are
    # seeded during the SNAP/heal write path (StackTrie fragment commit + heal subtree closure) so the
    # FIRST verification on a fresh node is already O(missing). Consensus-safe: a present node is
    # pruned ONLY when its subtree is durably proven complete (record written strictly AFTER the
    # subtree's bytes are committed); an absent record ⇒ descend (never a false prune). Completion is
    # declared through the SAME single chokepoint, so the decision / marker bytes / state root are
    # byte-for-byte identical to the full walk. Effective only under the Hash storage scheme (ETC
    # default); under Path scheme, flag off, or with no records present, the node falls back to the
    # UNCHANGED full-trie verification — safe to flip without data migration.
    pruned-heal-verification = true
    # Whether to validate state completeness before transitioning to regular sync
    # When enabled, walks the entire state trie to detect missing nodes
    # Recommended: true for production (ensures correctness)
    # Can be disabled for testing/debugging
    state-validation-enabled = true
    # Maximum number of retries for failed SNAP sync requests
    # Failed requests are retried with exponential backoff
    # Recommended: 3 retries
    max-retries = 3
    # Timeout for SNAP sync requests (GetAccountRange, GetStorageRanges, etc.)
    # Should be long enough to allow large responses to be transmitted
    # Recommended: 30 seconds (matches peer-response-timeout)
    timeout = 30 seconds
    # Maximum number of critical SNAP sync failures before SNAP goes dormant: it stops its
    # workers, keeps its progress, and restarts on a fresh pivot after a back-off (3 minutes,
    # doubling to a 20-minute cap). Critical failures include circuit breaker trips and state
    # validation failures.
    # Recommended: 5 failures (provides enough retries while preventing infinite loops)
    max-snap-sync-failures = 5
    # Grace period after bootstrap to wait for snap/1-capable peers.
    # If no connected peer advertises snap/1 within this window, SNAP goes dormant and retries
    # on a fresh pivot after the back-off. A network with no snap-serving peers never gets past
    # this point: set do-snap-sync = false there to sync by importing blocks.
    snap-capability-grace-period = 30 seconds
    # Account stagnation timeout: if no account range tasks complete within this window,
    # request an in-place pivot refresh to recover. On small peer pools (sepolia 2-3 peers)
    # the strike-counted demotion sets (PR #1255/#1256) can land all peers in
    # stateless+snapless within a single pivot window; the pivot refresh resets those sets
    # via the recovery path. Lower threshold = faster recovery from these windows.
    # Trade-off: too low risks pivot churn on transient slowdowns. On peer-scarce, huge-state
    # networks (ETC mainnet, 86M accounts, 1-3 snap peers) a single account range legitimately
    # takes minutes to advance through a churning 2-peer pool; 60s mistook these for stalls and
    # triggered pivot churn. 180s tolerates a slow-but-progressing range while still recovering
    # from a genuine stall. The eligible-set floor + pool-size cooldown (peer-retention fixes)
    # keep the pipe fed so true stalls are rarer.
    account-stagnation-timeout = 180 seconds
    # Maximum concurrent in-flight requests per peer for account and storage coordinators.
    # Core-geth pipelines 5+ concurrent requests per peer. Matching this eliminates idle time
    # between request send and response processing (50-200ms per response round-trip).
    # ByteCodeCoordinator already uses 5; this brings Account and Storage in line.
    max-inflight-per-peer = 5
    # Number of in-memory trie nodes accumulated before flushing to RocksDB.
    # Higher values reduce flush frequency (fewer expensive RocksDB write batches) at the
    # cost of more memory. With pipelining, flushing per-response becomes a bottleneck;
    # threshold-based flushing keeps the coordinator actor responsive.
    # Initial response size hint for AccountRange requests (bytes).
    # Core-geth uses ~500KB-1MB. Starting at 512KB avoids early timeouts on slower peers
    # that trigger the 0.5x ratchet down to the floor.
    account-initial-response-bytes = 524288
    # Minimum response size floor for AccountRange requests (bytes).
    # Prevents excessive small requests after repeated ratchet-downs.
    account-min-response-bytes = 102400
    # Enable parallel chain download (headers, bodies, receipts) during SNAP state sync.
    # Follows the Geth/Nethermind pattern of overlapping chain download with state download.
    # When SNAP state completes, the chain is already present and regular sync can start immediately.
    chain-download-enabled = true
    # Maximum concurrent ETH protocol requests for chain download.
    # Keep very low to avoid starving SNAP sync and PivotHeaderBootstrap of peers.
    # With ~10 peers, 2 concurrent chain requests leaves 8 peers for SNAP sync.
    chain-download-max-concurrent-requests = 2
    # Boosted concurrency after SNAP state sync completes. At this point all peers are free
    # for chain download — no need to reserve slots for SNAP protocol requests.
    # With 50 bodies/request, 16 concurrent = 800 bodies in-flight ≈ 4-5x speedup.
    chain-download-boosted-concurrent-requests = 16
    # Concurrency budget for chain backfill once SNAP state is finalised and regular sync has
    # taken over (#1162). Backfill yields peer slots to regular sync — kept at the same low
    # value as the SNAP-era cap so historical block download trails politely behind forward sync.
    chain-backfill-concurrent-requests = 2
    # Timeout for chain download ETH protocol requests (seconds).
    # Much shorter than SNAP sync timeout (45s) to avoid holding peers "busy" for too long.
    # If a peer can't respond in 10s it's likely overloaded — release it quickly.
    chain-download-timeout = 10s
    # Minimum number of SNAP-capable peers desired during SNAP sync.
    # When the node has fewer SNAP peers than this threshold, it will evict
    # non-SNAP outgoing peers to free connection slots for discovery to fill
    # with potentially SNAP-capable peers. This prevents the common scenario
    # where all peer slots fill with non-SNAP peers, starving SNAP sync.
    # Set to 2 (was 3): ETC mainnet realistically has only ~2 snap servers, so a target of 3
    # made eviction fire every cycle forever, thrashing discovery slots ("Too many peers" spam)
    # while never reaching the target. A fruitless-eviction backoff in SNAPSyncController now also
    # caps this churn, but a realistic target avoids most of it up front.
    min-snap-peers = 2
    # How often to check SNAP peer count and evict non-SNAP peers (seconds).
    # Lower values increase peer churn but find SNAP peers faster.
    snap-peer-eviction-interval = 10s
    # Maximum number of non-SNAP peers to evict per eviction cycle.
    # Keeps some non-SNAP peers for chain download and general protocol use.
    max-evictions-per-cycle = 3
    # Static SNAP server peers to always maintain a connection with during healing.
    # Add your local Besu (or any SNAP-serving node) here so it reconnects automatically
    # if it disconnects after the storage phase. Format: enode://PUBKEY@HOST:PORT
    # Example: snap-server-peers = ["enode://abc123@127.0.0.1:30304"]
    snap-server-peers = []
  }
  # Interval for updating peers during sync
  # Increased from 3s to 5s to reduce peer scanning overhead
  peers-scan-interval = 5.seconds
  # Duration for blacklisting a peer. Blacklisting reason include: invalid response from peer, response time-out, etc.
  # 0 value is a valid duration and it will disable blacklisting completely (which can be useful when all nodes are
  # are controlled by a single party, eg. private networks)
  # Reduced from 120s to 60s — ETC has a 40–50 peer pool; 120s is too aggressive for transient issues
  blacklist-duration = 60.seconds
  # Retry interval in regular sync: for picking blocks batch and retrying requests
  sync-retry-interval = 0.5 seconds
  # Response time-out from peer during sync. If a peer fails to respond within this limit, it will be blacklisted
  # Increased from 60s to 90s — ETC peers run on lower-spec hardware; 60s caused avoidable timeouts
  peer-response-timeout = 90.seconds
  # Interval for logging syncing status info
  print-status-interval = 30.seconds
  # Requested number of block headers when syncing from other peers
  # Aligned with max-blocks-headers-per-message to request full batches
  # Pushed to safe maximum of 1024 headers for maximum sync throughput
  block-headers-per-request = 1024
  # Requested number of block bodies when syncing from other peers.
  # Core-geth uses MaxBlockFetch=128 as the canonical batch size; go-ethereum enforces a
  # 2MiB softResponseLimit server-side regardless of how many hashes are requested, so
  # the server returns however many fit. 128 cuts body round-trips from ~21 to ~8 per
  # 1024-block batch at negligible bandwidth cost (ETC blocks avg 5-30KB).
  block-bodies-per-request = 128
  # Max. number of blocks that are going to be imported in one batch
  blocks-batch-size = 50
  # Requested number of TX receipts when syncing from other peers
  # Aligned with max-receipts-per-message to request full batches
  # Pushed to safe maximum of 1024 receipts for maximum sync throughput
  receipts-per-request = 1024
  # Number of peers to fetch the blocks in parallel for execution sync
  peers-to-fetch-from = 5
  # How often to query peers for new blocks after the top of the chain has been reached
  check-for-new-block-interval = 10.seconds
  # When we receive a branch that is not rooted in our chain (we don't have a parent for the first header), it means
  # we found a fork. To resolve it, we need to query the same peer for previous headers, to find a common ancestor.
  # Match geth's reorg resolution depth (64 blocks)
  branch-resolution-request-size = 64
  # threshold for storing non-main-chain blocks in queue.
  # if: current_best_block_number - block_number > max-queued-block-number-behind
  # then: the block will not be queued (such already queued blocks will be removed)
  max-queued-block-number-behind = 1000
  # threshold for storing non-main-chain blocks in queue.
  # if: block_number - current_best_block_number > max-queued-block-number-ahead
  # then: the block will not be queued (such already queued blocks will be removed)
  max-queued-block-number-ahead = 1000
  # Maximum number of blocks, after which block hash from NewBlockHashes packet is considered ancient
  # and peer sending it is blacklisted
  max-new-block-hash-age = 20
  # Maximum number of hashes processed form NewBlockHashes packet
  max-new-hashes = 64
  # This a recovery mechanism for the issue of missing state nodes during blocks execution:
  # off - missing state node will result in an exception
  # on - missing state node will be redownloaded from a peer and block execution will be retried. This can repeat
  #      several times until block execution succeeds
  redownload-missing-state-nodes = on
  # Sets max number of headers that can be waiting for bodies (waitingHeaders queue depth).
  # Raised to 2048 to allow one full 1024-header batch to be pre-fetched while the previous
  # batch's bodies are still downloading — mirrors core-geth's concurrent downloader pattern.
  # Warning: do not set below block-headers-per-request; that would block all header fetches.
  max-fetcher-queue-size = 2048

  # Import backpressure threshold: pause header fetching when readyBlocks (bodies landed,
  # awaiting import) reaches this size. Decoupled from max-fetcher-queue-size so the two
  # signals (header pre-fetch depth vs. importer falling behind) can be tuned independently.
  max-ready-blocks-queue-size = 512

  # Number of concurrent slice-fetcher workers for body fan-out (Change 3).
  # Each worker independently requests a slice of the hash batch from PeersClient.
  # Conservative default for ETC mainnet's 15-25 peer pool; set to 1 to disable fan-out.
  bodies-fetch-concurrency = 4

  # Maximum backoff delay for body fetch retries. Backoff is exponential:
  # min(sync-retry-interval * 2^retryCount, max-retry-delay)
  # This prevents tight retry loops when all peers are blacklisted.
  max-retry-delay = 30.seconds

  # Maximum number of body fetch retries before clearing tried peers and resetting.
  # After this many retries, previously blacklisted peers may have recovered.
  max-body-fetch-retries = 10

  # Post-merge: require an engine_forkchoiceUpdated from the consensus layer before SNAP
  # can begin selecting a pivot. On post-merge chains (Sepolia, mainnet) total-difficulty
  # is frozen at TerminalTotalDifficulty so peer-best-by-TD selection is unreliable. The
  # CL is the authoritative source of the chain head.
  #
  # When true (default), SNAP waits indefinitely for the CL hint on chains with TTD.
  # When false, SNAP falls back to peer-best-by-block-number after `cl-wait-timeout`.
  # ETC mainnet (TTD = None) ignores both settings — the existing TD-based path is used.
  # Closes #1207.
  engine-api-required = true

  # Maximum time to wait for the CL to push a head on post-merge chains before falling
  # back to peer-best-by-block-number. Only consulted when `engine-api-required = false`.
  cl-wait-timeout = 5.minutes

  # Checkpoint sync: when set to a non-empty path AND the database is fresh (best-block == 0)
  # AND SNAP is not already marked done, the node will import the referenced `.checkpoint`
  # archive at startup instead of running SNAP. Use this on post-merge chains (sepolia,
  # ETH mainnet) where SNAP-serving peers are scarce. A trailing `.gz` is decoded transparently.
  # Empty string = disabled (the default).
  #
  # See `src/main/scala/com/chipprbots/ethereum/blockchain/checkpoint/CheckpointArchive.scala`
  # for the on-disk format.
  checkpoint-sync-file = ""

  # HTTP fetch of the checkpoint archive. When set AND no local checkpoint-sync-file is
  # configured AND the DB is fresh AND SNAP isn't done, fukuii downloads this URL to
  # ${datadir}/checkpoint.bin (resumable via HTTP Range), then imports it via the same
  # path as checkpoint-sync-file. Empty string = disabled.
  #
