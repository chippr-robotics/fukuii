state {
    # IN-DEVELOPMENT GUARD ONLY (spec 018 Track C). Selects the unified, position-keyed state layout while the
    # track's pull requests land, so that staging stays green between them. It is not an operator option: it is
    # never shipped as a transition, and it is deleted, with the Hash-scheme code it guards, in the track's last
    # slice. After that there is no flag and no second layout. Leave it false.
    path-live = false

    # Everything below belongs to the unified layout and is read only when it is in use.

    changeset {
        # A storage trie that is replaced whole (its account removed, or its storage cleared) has its rows deleted
        # by the block that replaces it. Above this many rows they are NOT deleted: they stay on disk, unreachable,
        # and the block's changeset record is written as a tombstone, which no head move may cross.
        max-entries-per-owner-delete = 1000000

        # A block's changeset record above this many bytes (256 MiB) is written as a tombstone as well. Neither bound
        # ever fails a block.
        max-record-bytes = 268435456
    }

    retention {
        # Changeset records are kept for some blocks below the head, and a head move deeper than what is kept is
        # refused: the node then syncs its state again. How many:
        #  - with a finalized block (a node driven by a consensus client): head - finalized + finality-margin;
        #  - with none (a proof-of-work chain, or a consensus client that has not reported one): without-finality.
        # Never fewer than pruning.history, and never more than max-blocks.
        finality-margin = 16
        max-blocks = 512

        # A proof-of-work chain can be reorganised to any depth its attackers can pay for; ETC was, by thousands of
        # blocks, in 2020. 512 is one record per block for about two hours of ETC. May not exceed max-blocks.
        without-finality = 512
    }

    overlay {
        # Blocks executed and not yet on disk, with the resident changesets of recent blocks: bytes held in memory.
        max-bytes = 268435456

        # The layers of one branch under execution, counted apart from max-bytes.
        pinned-max-bytes = 268435456

        max-forward-layers = 32
        resident-reverse-blocks = 16

        # One block's changes above this many bytes (64 MiB) are logged and written straight to disk.
        max-layer-bytes = 67108864

        # How many moves of the state on disk a reader's view outlives. An older view is retried.
        max-view-age-moves = 8
    }

    # A head move across more blocks than this is written in several batches, each one atomic.
    move { max-blocks-per-batch = 256 }

    # Under pruning.mode = "archive": how many blocks back a view of the state reaches. Head moves are not bounded.
    archive { view-reach = 1024 }

    recovery {
        # How many blocks a local re-execution may cover to rebuild a state that is no longer held.
        max-blocks = ${fukuii.pruning.history}

        # For a node driven by a consensus client: consecutive refused forkchoiceUpdated calls (about two epochs at
        # one per slot) before the node gives its state up and syncs it again, and the shortest time between two
        # such escalations. A proof-of-work node receives no such calls, and the count does nothing there.
        escalation-refusals = 64
        escalation-cooldown = 6h
    }

    # How far below the head a fork point may lie for a head move to be attempted: `floor` is the retention floor
    # above, which is what the changeset records cover. A number below the floor is honoured.
    reorg { max-depth = floor }
}
