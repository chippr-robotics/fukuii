txPool {
    # Maximum number of pending transaction kept in the pool
    tx-pool-size = 1000

    pending-tx-manager-query-timeout = 60.seconds

    transaction-timeout = 2.minutes

    # Used in mining (ethash)
    get-transaction-from-pool-timeout = 60.seconds

    # Byte budget for the EIP-4844 blob sidecars (blobs, commitments, proofs) kept for pooled blob transactions, so
    # they can be served in network form. Past it the oldest blob transactions are evicted, sidecar and transaction
    # together (go-ethereum's blobpool keeps a byte budget the same way).
    blob-sidecar-budget = 256 MiB

    # Per-peer "known transaction" tracking (suppresses re-announcing a tx to a peer that has it): at most this many
    # tx hashes, each forgotten after this long untouched. Forgetting only risks a duplicate announcement.
    known-tx-max-entries = 131072
    known-tx-ttl = 10.minutes

    # Outstanding GetPooledTransactions requests whose reply is checked against the announced type/size: at most this
    # many, each forgotten after this long without a reply (go-ethereum times announcements out the same way).
    announcement-max-entries = 32768
    announcement-timeout = 2.minutes

    # An announced tx is requested from one announcing peer at a time. If that peer has not answered after this long,
    # the tx is requested from the next peer that announced it (go-ethereum's txFetchTimeout).
    announcement-fetch-timeout = 5.seconds
  }