state-read-caches {
    # In-process read caches on the block-import / EVM path (all consensus-neutral memoisation of
    # immutable, content-addressed or root-scoped data). Every cache is bounded. Sizes are BYTES unless noted.
    # The JVM heap is the budget for all of these together; defaults are deliberately conservative for -Xmx4g.

    # JUMPDEST analysis (valid jump-destination bit set), keyed by code hash. ~1 bit per code byte, so a 64 KB
    # contract costs ~8 KB; 32 MiB holds ~4,000 such contracts. 0 disables the cache (analysis is still fast).
    jumpdest-cache-bytes = 33554432
}
