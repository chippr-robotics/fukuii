state-read-caches {
    # In-process read caches on the block-import / EVM path (all consensus-neutral memoisation of
    # immutable, content-addressed or root-scoped data). Every cache is bounded. Sizes are BYTES unless noted.
    # The JVM heap is the budget for all of these together; defaults are deliberately conservative for -Xmx4g.
    #
    # The byte-size keys below are SHIPPED COMMENTED OUT, showing their defaults. Left unset, each default is also
    # capped at a fraction of the max heap (code 5%, code-size 2%, decoded-node 4%, JUMPDEST 1%, block memo 2%) so a
    # small JVM (a 1.5 GB CI run) cannot be exhausted by the absolute defaults. Setting a key EXPLICITLY bypasses that
    # fraction: the configured value is used as-is, up to a safety ceiling of 50% of the max heap (a WARN is logged when
    # it clamps). The effective size of every cache is logged once at startup. For a heavy-block node at -Xmx8g, e.g.:
    #   code-cache-bytes = 2684354560      # ~2.5 GiB
    #   jumpdest-cache-bytes = 314572800   # ~300 MiB

    # JUMPDEST analysis (valid jump-destination bit set), keyed by code hash. ~1 bit per code byte, so a 64 KB
    # contract costs ~8 KB; 32 MiB holds ~4,000 such contracts. 0 disables the cache (analysis is still fast).
    # jumpdest-cache-bytes = 33554432

    # Per-BLOCK memo of JUMPDEST analyses, in front of the cache above: one block analyses each distinct code once,
    # then the memo is dropped with the block's world. Entries are bit sets truncated at the last JUMPDEST. Budget per
    # block in bytes; when it is spent, further analyses fall back to the cache above. 0 disables the memo.
    # jumpdest-block-memo-bytes = 67108864

    # Contract code by code hash, read by the EVM (per EvmCodeStorage instance). Code is immutable under its hash, so
    # only successful reads are cached: an absent code is never remembered as absent. A 64 KB contract costs 64 KB.
    # 256 MiB (geth's size) holds ~4,000 such contracts, also the window the BAL prefetch can run ahead in (it fills
    # at most half of it per block); soft-referenced, so it gives way under heap pressure. Default capped at 5% of the heap; explicit values are not.
    # code-cache-bytes = 268435456

    # Contract code LENGTH by code hash (EXTCODESIZE and size checks never load the code on a hit), about 256 bytes an
    # entry, so 64 MiB holds ~260k hashes. Filled by every successful code read; 0 disables it.
    # code-size-cache-bytes = 67108864

    # Decoded trie nodes by node hash, in front of the reference-counted state storage, for BLOCK EXECUTION only
    # (SNAP, healing and recovery read the storage directly and never through this cache). Entries for nodes that
    # pruning or rollback deletes are evicted. Sized by encoded length x 3 (decoded objects are larger than the RLP).
    # decoded-node-cache-bytes = 100663296

    # Per-world memo of reads of the BASE (persisted) account trie and of each storage trie, in entries summed over
    # one world (one block). The memo is scoped to an immutable trie root, so a write or a persist never sees it.
    world-read-memo-entries = 250000

    # Log the per-block [IMPORT-TIMING] line (where one block's import time went) at INFO instead of DEBUG.
    # Off by default so a full resync does not emit one INFO line per block; the counters run either way.
    import-timing-log = false

    # BAL-driven prefetch of an Amsterdam block's state and code (EIP-7928). When a block arrives with its block access
    # list (engine_newPayloadV5) and the list matches the header's blockAccessListHash, a bounded pool reads the listed
    # accounts, storage slots and the code of those accounts from the PARENT state while the block executes. It only
    # warms caches (consensus-neutral); an absent BAL, or any non-Amsterdam block (every ETC chain), does nothing.
    bal-prefetch-enabled = true
    # Pool size = outstanding reads against the device. Start at 16-32 for a SATA SSD; measure before going higher.
    bal-prefetch-threads = 16
    # Keys per prefetch task.
    bal-prefetch-batch-size = 64
    # Per-block share of the decoded-node cache / code cache the prefetch may fill (0 = half of each cache).
    bal-prefetch-node-budget-bytes = 0
    bal-prefetch-code-budget-bytes = 0
}
