# Shared TLS profiles (spec 030). A listener names one of these in its own `tls { profile = "<name>" }` block, for
# example fukuii.network.rpc.http.tls. The node validates every named profile before any port binds and refuses to
# start on the first failure. See docs/runbooks/tls-operations.md.
tls {
  profiles {
    # example; none is defined by default
    # rpc {
    #   keystore   { path = "tls/rpc-server.p12", type = "pkcs12", password-file = "tls/rpc-server.password" }
    #   key-alias  = null            # required when the keystore holds more than one private key
    #   truststore { path = "tls/clients-ca.p12", type = "pkcs12", password-file = "tls/clients-ca.password" }
    #   protocols = []               # e.g. ["TLSv1.3"]; anything below TLSv1.2 is a startup error
    #   cipher-suites = []
    #   # The files above are re-read when they change (SHA-256 of their content, so a same-second edit and a
    #   # Kubernetes `..data` symlink swap are both seen). A replacement that validates serves new handshakes; open
    #   # connections keep theirs. One that does not keeps the material in service, logs an ERROR and counts in
    #   # app_tls_reload_failures_total{profile}.
    #   reload { enabled = true, interval = 1.minute }
    #   # app_tls_certificate_expiry_seconds{profile, role} always; a WARN once a day within this of notAfter
    #   expiry-warning = 14.days
    # }
  }
}
