include classpath("application.conf")

fukuii {
  blockchains {
    network = "eth"
  }

  sync {
    # ETH mainnet is post-merge — blocks come via Engine API from the consensus layer.
    do-snap-sync = false

    snap-sync {
      # ETH mainnet (post-merge) uses path-scheme trie storage: one node per path slot,
      # enabling inline pruning.
      storage-scheme = "path"
      # Backfill historical bodies/receipts only after SNAP state is complete (disk-IO contention, see base/sync.conf).
      defer-chain-backfill-until-state-complete = true
    }
  }

  # ETH-family chain: advertise eth/70 (EIP-7975 partial receipts) and eth/71 (EIP-8159 block access
  # lists) on top of the eth/68-69 + snap/1 defaults (see conf/base/network.conf). eth/71 lets regular-sync
  # catch-up fetch Amsterdam block access lists from peers and prefetch state; no list is requested for a
  # header without blockAccessListHash, so it is inert before Amsterdam. Peers that do not offer eth/70-71
  # negotiate down to eth/69. snap/2 stays off: it drops GetTrieNodes, which SNAP healing needs.
  network.protocols {
    eth70 = true
    eth71 = true
  }

  mining {
    # Post-merge chain: blocks arrive from the consensus layer over the Engine API,
    # they are not Ethash-sealed. Without this override the value inherited from
    # conf/base/mining.conf is `pow`, which wires PoWBlockHeaderValidator ->
    # EthashBlockHeaderValidator.validateHeader unconditionally (no difficulty == 0
    # branch), so every PoS header would fail with HeaderPoWError the moment the
    # header validator is actually reached. `engine-api` selects
    # TransitionBlockHeaderValidator, which dispatches on difficulty: PoW rules for
    # pre-merge blocks, PoS rules for difficulty == 0.
    #
    # This is inert for block building -- MiningBuilder.buildMining maps EngineApi to
    # the same buildPoWMining() as PoW, and mining-enabled stays false.
    #
    # The deployment overlay ops/barad-dur/eth/fukuii-conf/eth.conf already sets
    # this; the bundled config did not, so anyone running -Dconfig.resource=conf/eth.conf
    # without the overlay got the wrong validator.
    protocol = "engine-api"
  }
}
