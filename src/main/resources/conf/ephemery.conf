include classpath("application.conf")

# Ephemery — the periodically resetting ETH testnet (https://github.com/ephemery-testnet/ephemery-resources).
# Launch with `fukuii ephemery`. Ephemery is built in: the current iteration ships in the jar, and nothing has to be
# prepared first (spec 028; docs/runbooks/ephemery.md).
#
# Ephemery resets to a new genesis every 28 days (2,419,200 s) with a new chain id (39438000 + iteration), genesis
# timestamp, BPO timestamps and genesis hash. At start the node picks the newest current iteration (a cached one, or the
# bundled one) before this configuration loads, keeps it under <datadir>/releases/ephemery-N, and runs it in its own
# datadir <datadir>/ephemery-N. When the iteration ends the node exits with code 75, for a supervisor to restart.
#
# scripts/ephemery/fetch-genesis.sh is the optional way to pin or prepare an iteration by hand: launch with
# FUKUII_CONF_DIR=<out>/current/conf, or set fukuii.blockchains.custom-chains-dir to a directory holding
# ephemery-chain.conf, and fukuii uses that directory as it always did (no fetch, no exit at the reset).
#
# Post-Merge from genesis (Shanghai..Osaka at genesis): pair with a consensus client over the Engine API.
fukuii {
  blockchains {
    network = "ephemery"

    # No custom-chains-dir here: it counts only when an operator sets it (to a prepared directory), and then it wins.
  }

  ephemery {
    # false: never contact the network. Run the newest current cached or bundled iteration; after its reset, refuse
    # (exit 78).
    refresh = true

    # Where releases come from: the default (hop allow-list enforced), another https base URL laid out as
    # <base>/releases/download/ephemery-N/testnet-all.tar.gz, or an absolute path to an unpacked release directory.
    source = "https://github.com/ephemery-testnet/ephemery-genesis"

    # Total time a startup may spend on the refresh, retries included. Bounded to [10s, 300s].
    refresh-timeout = 60s

    # true: at the reset, WARN and exit 75 (a supervisor restarts the node onto the next iteration). false: WARN only,
    # for runs without a supervisor.
    exit-at-reset = true
  }

  sync {
    # Ephemery's chain is at most 28 days long (~200k blocks): regular sync from genesis toward the head the
    # consensus client designates with forkchoiceUpdated executes every block, which is what an import
    # differential needs. Set do-snap-sync = true to SNAP-sync to the head instead.
    do-snap-sync = false

    snap-sync {
      # Same trie layout as the other post-merge ETH chains (see sepolia.conf).
      storage-scheme = "path"
    }
  }

  # Post-merge chain: it syncs only with a consensus client, so the Engine API is on by default. It binds to
  # localhost:8551 (network.engine-api.interface); the consensus client takes `--execution-jwt <datadir>/jwt.hex`,
  # or `network.engine-api.jwt-secret-path` when that is set (use an absolute path to share or pin the secret).
  network.engine-api.enabled = true

  # ETH-family chain: advertise eth/70 and eth/71 on top of the eth/68-69 + snap/1 defaults, as sepolia.conf
  # does. Peers that do not offer them negotiate down to eth/69.
  network.protocols {
    eth70 = true
    eth71 = true
  }

  mining {
    # Post-merge chain: `engine-api` selects TransitionBlockHeaderValidator, which applies PoS header rules
    # to difficulty-0 blocks. The inherited default (`pow`) would wire the Ethash validator. See sepolia.conf.
    protocol = "engine-api"
  }
}
