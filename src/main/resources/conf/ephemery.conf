include classpath("application.conf")

# Ephemery — the periodically resetting ETH testnet (https://github.com/ephemery-testnet/ephemery-resources).
# Launch with `fukuii ephemery`, after preparing the current iteration with scripts/ephemery/fetch-genesis.sh.
#
# Ephemery resets to a new genesis every 28 days (2,419,200 s) with a new chain id (39438000 + iteration),
# genesis timestamp, BPO timestamps and genesis hash. No iteration is built into fukuii: the chain config
# and genesis are GENERATED per iteration by fetch-genesis.sh into a custom-chains-dir
# (<dir>/ephemery-chain.conf + ephemery-genesis.json). The script also writes an operator conf that includes
# this file and sets that dir plus a per-iteration datadir — run with FUKUII_CONF_DIR=<out>/current/conf.
# Runbook: docs/runbooks/ephemery.md.
#
# Post-Merge from genesis (Shanghai..Osaka at genesis): pair with a consensus client over the Engine API.
fukuii {
  blockchains {
    network = "ephemery"

    # Default: the script's default output, current iteration. Overridden by the generated operator conf,
    # or with -Dfukuii.blockchains.custom-chains-dir=... . Without a generated ephemery-chain.conf here,
    # startup fails with "blockchain network 'ephemery' is not configured".
    custom-chains-dir = ${user.home}"/.fukuii/ephemery-network/current/chains"
  }

  sync {
    # Ephemery's chain is at most 28 days long (~200k blocks): regular sync from genesis toward the head the
    # consensus client designates with forkchoiceUpdated executes every block, which is what an import
    # differential needs. Set do-snap-sync = true to SNAP-sync to the head instead.
    do-snap-sync = false

    snap-sync {
      # Same trie layout as the other post-merge ETH chains (see sepolia.conf).
      storage-scheme = "path"
      defer-chain-backfill-until-state-complete = true
    }
  }

  # ETH-family chain: advertise eth/70 and eth/71 on top of the eth/68-69 + snap/1 defaults, as sepolia.conf
  # does. Peers that do not offer them negotiate down to eth/69.
  network.protocols {
    eth70 = true
    eth71 = true
  }

  mining {
    # Post-merge chain: `engine-api` selects TransitionBlockHeaderValidator, which applies PoS header rules
    # to difficulty-0 blocks. The inherited default (`pow`) would wire the Ethash validator. See sepolia.conf.
    protocol = "engine-api"
  }
}
