include "app.conf"

fukuii {

  datadir = ${user.home}"/.fukuii-rpc-test/"${fukuii.blockchains.network}

  blockchains {

    network = "rpc-test-private"

    rpc-test-private = ${fukuii.blockchains.etc}
    rpc-test-private {
      dao = null
      custom-genesis-file = ./conf/rpc-test-private-genesis.json

      monetary-policy {
      }

      bootstrap-nodes = []
    }
  }

  mining {
    # Miner's coinbase address
    coinbase = "0011223344556677889900112233445566778899"
    mining-enabled = false
  }


  network {
    server-address {
      interface = "127.0.0.1"
    }

    discovery {
      discovery-enabled = false
    }

    peer {
      max-incoming-peers = 0
      max-pending-peers = 0
    }

    rpc {
      http {
        mode = "http"
        enabled = true
        interface = "localhost"
        port = 8546

        certificate = null

        cors-allowed-origins = "*"
      }

      ipc {
        enabled = false
      }

      # The PrivNet scenarios call personal_newAccount, personal_unlockAccount, personal_sendTransaction and
      # personal_listAccounts; `personal` is not in the default set (eth, net, web3, fukuii)
      apis = "eth,web3,net,personal,fukuii"
    }
  }

  sync {
    do-snap-sync = false
  }
}
