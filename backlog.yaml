  - id: B-281
    title: "RocksDbDataSource: a manual compaction that does not hold the database lock (compactionGuard, per family, cancellable), then the TUI's compact action"
    priority: P2
    status: done
    area: storage
    size: M
    opened: 2026-11-14
    closed: 2026-11-18
    refs: []
    links:
      prs: [1923, 1928]
      spec: 029
    notes: |-
      vault, spec 029 slice 7: compactRange holds dbLock.readLock for the whole native call while writes take the write lock, so a whole-database compaction stops block import for hours and cannot be cancelled. Shape: a separate compactionGuard RW lock; dbLock only for assureNotClosed and the handle; CompactRangeOptions.setExclusiveManualCompaction(false) and setCanceled; largest family first, guard released between families; close() cancels, then takes the guard's write lock, then dbLock's. Also fixes the cause for SnapStorageDoneStorage.compact and HealingFrontierStorage. Until then the dashboard lists compaction under 'not offered, and why' (a departure from spec 029 FR-054).
      Closes #1689 (was B-029).
      2026-11-18: #1928 fixed a race in #1923's close-during-compaction test (it waited 30 s when close() started late on CI); no production change.
