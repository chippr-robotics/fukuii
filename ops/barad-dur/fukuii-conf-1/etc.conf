# Barad-dur Primary — ETC Mainnet
include "conf/base/fukuii.conf"
include "conf/base/pekko.conf"
include "conf/base/logging.conf"

logging.logs-level = "INFO"
pekko.loglevel = "INFO"
pekko.log-dead-letters = 0

fukuii {
  datadir = "/app/data"
  client-identity = "barad-dur"

  blockchains {
    network = "etc"
  }

  sync {

    snap-sync {
      # Evict up to 5 non-SNAP peers per cycle (base: 3) — more aggressive for faster
      # SNAP peer discovery on barad-dur where only ~2 SNAP servers are reachable.
      max-evictions-per-cycle = 5

      # Force SERIAL post-SNAP healing on this memory-tight 16GB host (2026-06-14).
      # PR #1348 (spec 002, US3) moved the BFS sub-range readers off the parent walk's
      # dispatcher onto a dedicated healing-reader-dispatcher. v0.7.7 ran them on the
      # parent's pool where they queued behind the parked Await (an accidental throttle);
      # making them truly concurrent raised peak anon-RSS at the L5/L6 memory peak from
      # just-under-8GiB to ~8.33GiB, crossing the 8GiB cgroup cap → kernel cgroup OOM-kill
      # (SIGKILL, exit 137) mid-L5 every cycle. parallelism=1 takes the serial walk branch
      # (no reader split), restoring the lower peak so the walk fits under the cap. The
      # 4-core host only gave effectiveParallelism=2 anyway and the walk is disk-bound, so
      # the throughput cost is small. Remove once the durable fix (bound reader/RocksDB
      # native footprint) lands. See spec 002 follow-up.
      healing-traversal-parallelism = 1
    }
  }

  network {
    server-address {
      interface = "0.0.0.0"
      # Bind TCP P2P on the same port we advertise externally (30303). Earlier this was
      # 9076 with a Docker port translation `30303:9076/tcp`, but the ENR records what we
      # bind to, not what Docker maps — so peers received "tcp=9076" and the firewall
      # (which only forwards 30300–30310) dropped them. Now ENR=30303 matches forwarding.
      port = 30303
    }

    discovery {
      discovery-enabled = true
      host = "23.122.124.251"
      interface = "0.0.0.0"
      port = 30303
      scan-interval = 10.seconds
    }

    rpc {
      http {
        enabled = true
        interface = "0.0.0.0"
        port = 8545
        cors-allowed-origins = []
        rate-limit {
          enabled = false
        }
      }
      ipc {
        enabled = false
      }
      apis = "eth,web3,net,personal,fukuii,debug,qa"
    }

    peer {
      update-nodes-interval = 5.seconds
      min-prune-age = 5.minutes
      short-blacklist-duration = 2.minutes
      long-blacklist-duration = 30.minutes
    }
  }

  mining {
    mining-enabled = false
    coinbase = "0011223344556677889900112233445566778899"
    protocol = "pow"
    header-extra-data = "fukuii-barad-dur"
  }

  metrics {
    enabled = true
    port = 9095
  }
}
