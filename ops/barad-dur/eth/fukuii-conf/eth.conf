# Barad-dur ETH Mainnet — Ethereum mainnet (Engine API / post-merge PoS)
#
# Pulls the packaged ETH mainnet profile from the classpath (network = "eth",
# post-merge sync flags, path-scheme trie storage) and layers barad-dur
# deployment-specific overrides on top: datadir, network ports, RPC/Engine API
# binding, metrics port, and logging.
include classpath("eth.conf")

include "conf/base/pekko.conf"
include "conf/base/logging.conf"

logging.logs-level = "INFO"
pekko.loglevel = "INFO"
pekko.log-dead-letters = 0

fukuii {
  datadir = "/app/data"
  client-identity = "barad-dur-eth"

  sync {
    # ETH mainnet is post-merge — blocks arrive via Engine API from the
    # consensus layer (Lighthouse). do-snap-sync inherited
    # false from classpath("eth.conf"); the CL drives import via newPayload +
    # forkchoiceUpdated.
    use-bootstrap-checkpoints = true

    peer-response-timeout = 90.seconds
    blacklist-duration = 60.seconds
  }

  network {
    server-address {
      interface = "0.0.0.0"
      port = 30307
    }

    discovery {
      discovery-enabled = true
      host = "23.122.124.251"
      interface = "0.0.0.0"
      port = 30307
    }

    rpc {
      http {
        enabled = true
        interface = "0.0.0.0"
        port = 8545
        cors-allowed-origins = []
        rate-limit {
          enabled = false
        }
      }
      ipc {
        enabled = false
      }
      apis = "eth,web3,net,personal,fukuii,debug,qa"
    }

    # Engine API — consensus layer interface
    engine-api {
      enabled = true
      interface = "0.0.0.0"
      port = 8551
      jwt-secret-path = "/app/jwt/jwt.hex"
    }

    peer {
      update-nodes-interval = 5.seconds
      min-prune-age = 5.minutes
      short-blacklist-duration = 2.minutes
      long-blacklist-duration = 30.minutes
    }

    # Protocol capability overrides for ETH mainnet.
    # geth v1.17.3 and Besu 26.6.0 both ship eth70 in production; the mainnet
    # peer pool is ready for it.
    # eth68, eth69, snap1: inherited true from base/network.conf
    # eth71: Besu 26.6.0 has it; hold until geth ships it in a tagged release.
    # snap2: not in any production release; hold indefinitely per geth safety gate.
    protocols {
      eth70 = true
    }
  }

  mining {
    mining-enabled = false
    coinbase = "0000000000000000000000000000000000000000"
    # Engine API protocol — post-merge, no PoW
    protocol = "engine-api"
    header-extra-data = "fukuii-eth"
  }

  metrics {
    enabled = true
    port = 9095
  }
}

# Override logback for Engine API visibility
logging.custom-loggers {
  "com.chipprbots.ethereum.consensus.engine" = "INFO"
}
