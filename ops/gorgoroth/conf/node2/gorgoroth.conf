include "base-gorgoroth.conf"

fukuii {
  mining {
    mining-enabled = false
    coinbase = "0x2000000000000000000000000000000000000002"
  }

  sync {
    # Force legacy sync to validate state import without snap
    do-snap-sync = false
  }

  network {
    discovery {
      discovery-enabled = false
    }

    server-address {
      port = 30303
    }

    peer {
      # Force legacy p2p version to keep Snappy compression disabled for diagnostics
      p2p-version = 5
    }

    rpc {
      http {
        interface = "0.0.0.0"
        # plaintext on 0.0.0.0 by choice, on the deployment's own network (spec 030; or tls.enabled = true)
        allow-insecure-bind = true
        port = 8545
      }
      ws {
        interface = "0.0.0.0"
        # plaintext on 0.0.0.0 by choice, on the deployment's own network (spec 030; or tls.enabled = true)
        allow-insecure-bind = true
        port = 8546
      }
    }
  }
}
