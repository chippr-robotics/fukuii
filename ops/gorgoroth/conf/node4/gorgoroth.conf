include "base-gorgoroth.conf"

fukuii {
  mining {
    mining-enabled = false
    coinbase = "0x4000000000000000000000000000000000000004"
  }

  sync {
    do-snap-sync = true
  }

  network {
    discovery {
      discovery-enabled = true
    }

    server-address {
      port = 30303
    }

    peer {
      # Keep diagnostics aligned with node2 for reproducible runs
      p2p-version = 5
    }

    rpc {
      http {
        interface = "0.0.0.0"
        # plaintext on 0.0.0.0 by choice, on the deployment's own network (spec 030; or tls.enabled = true)
        allow-insecure-bind = true
        port = 8545
      }
      ws {
        interface = "0.0.0.0"
        # plaintext on 0.0.0.0 by choice, on the deployment's own network (spec 030; or tls.enabled = true)
        allow-insecure-bind = true
        port = 8546
      }
    }
  }
}
